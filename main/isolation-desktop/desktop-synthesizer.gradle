// Alternate application entry point for the fullscreen Ubuntu White Desktop Synthesizer.
// The standard build.gradle remains the compatibility preview entry point.
plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ubuntu.white'
version = '0.1.0-SNAPSHOT'

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

javafx {
    version = '21.0.8'
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainClass = 'org.ubuntu.white.desktop.DesktopSynthesizer'
}

run { standardInput = System.in }
