# Ubuntu White Edition — desktop icon source contract
#
# The artwork selected for the initial Desktop LAF is maintained exclusively
# in the repository's ubuntu-white/icons tree. This configuration describes
# how the ISO build must consume it; it does not duplicate or alter artwork.

[source]
root=ubuntu-white/icons

[theme]
name=Ubuntu-White
scope=desktop

[policy]
# Treat the icon tree as trusted build input only after structural validation.
# Do not follow symlinks outside the repository icon root during installation.
allow_external_symlinks=false
preserve_transparency=true
preserve_source_artwork=true

[installation]
# The build system supplies the target icon-theme directory. Artwork is copied
# into the theme package after validation rather than being written into GNOME
# source trees.
