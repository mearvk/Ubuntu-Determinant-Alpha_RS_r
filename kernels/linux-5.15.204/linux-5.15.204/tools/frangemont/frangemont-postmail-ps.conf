# frangemont-postmail-ps.conf — Byte-Level Package Safety Inspection
#
# Configuration for the frangemont-postmail-ps daemon.
# Installed by default in the basic userland install.
#
# Copyright (C) 2026 MEARVK LLC

# ─── DAEMON ──────────────────────────────────────────────────────────────────

# Run as daemon (1) or foreground (0)
daemon = 1

# Verbose logging (0 = normal, 1 = detailed per-pattern matches)
verbose = 0

# Socket path for inter-process communication
socket = /run/frangemont-postmail-ps.sock

# PID file
pidfile = /run/frangemont-postmail-ps.pid

# ─── STAGES ──────────────────────────────────────────────────────────────────

# Enable/disable inspection stages (all enabled by default)
stage_inflight = 1        # Watch downloads in progress
stage_atrest = 1          # Scan before install
stage_precopy = 1         # Verify before unpack
stage_postinstall = 1     # Mandatory post-install scan (cannot be disabled)

# ─── SCORING ─────────────────────────────────────────────────────────────────

# Verdict thresholds (cumulative score across all 5 axes)
threshold_clear = 100     # Below this: silent pass
threshold_notice = 300    # Below this: log only
threshold_concern = 600   # Below this: log + notify admin
threshold_hold = 800      # Below this: pause install, Grade 3+ to continue
# Above hold: REJECT — Grade 7+ override required

# Per-axis score cap (prevents single-axis domination)
axis_cap = 200

# ─── INTEGRATION ─────────────────────────────────────────────────────────────

# MySQL package registry integration
mysql_enabled = 1
mysql_socket = /run/mysqld/mysqld.sock
mysql_database = system_registry

# Chat notification on HOLD/REJECT
chat_notify = 1
chat_channel = ops-team

# ClamAV cross-check (scan flagged files with ClamAV too)
clamav_crosscheck = 1

# Dave awareness (export findings to Dave's knowledge base)
dave_export = 1

# ─── EXCLUSIONS ──────────────────────────────────────────────────────────────

# Packages exempt from inspection (trusted base OS packages)
# These still get Stage 4 (post-install) but skip HOLD/REJECT
exempt_packages = apt,dpkg,libc6,linux-image,systemd,coreutils,bash

# Directories exempt from behavioral scanning
# (These legitimately contain kernel/security code)
exempt_paths = /usr/src/linux,/usr/include/linux

# ─── KERNEL AWARENESS ────────────────────────────────────────────────────────

# Additional kernel-mode patterns to flag (beyond built-in list)
# Format: pattern:weight:reason
# extra_kernel_patterns =

# ─── MEMORY AWARENESS ────────────────────────────────────────────────────────

# Flag packages that install into /dev/shm or use shared memory IPC
# beyond normal levels
memory_sharing_threshold = 3    # Number of shm patterns before concern

# Arena Pool awareness: flag packages that allocate > threshold
arena_pressure_threshold_mb = 64

# ─── SUDO GATE INTEGRATION ──────────────────────────────────────────────────

# Override grade required for HOLD verdict
hold_override_grade = 3

# Override grade required for REJECT verdict
reject_override_grade = 7
