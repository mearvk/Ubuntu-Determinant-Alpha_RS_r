# sudo_gate.conf - Configuration for Privilege Grade System
#
# This file controls the behavior of sudo_gate, the privilege
# gate wrapper that enforces graded access levels (1-8).
#
# SYNTAX:
#   key = value
#   Lines starting with # are comments.
#
# Last updated: 2026-08-02
# Distribution: Galactic Cherry Marvell Edition 98

# ============================================================
# General Settings
# ============================================================

# Enable/disable the gate system entirely.
# If disabled, all commands pass through to sudo normally.
# Values: enabled | disabled
gate_enforcement = enabled

# Log all invocations (not just grade 7-8)?
# Values: all | elevated_only
log_level = elevated_only

# Path to the real sudo binary
sudo_real_path = /usr/bin/sudo.real

# Path to audit log
log_path = /var/log/sudo_gate.log

# ============================================================
# Grade Overrides
#
# Override the default classification for specific commands.
# Format: override <command> <grade>
# ============================================================

# Example: force 'docker' to always be grade 6
# override docker 6

# Example: force 'kubectl delete namespace' to be grade 8
# override_pattern "kubectl delete namespace" 8

# ============================================================
# Admin Identity (for HPM integration)
#
# Restrict which users can use grade 7-8 gates.
# By default, any user with sudo access can use any gate.
# Uncomment to restrict:
# ============================================================

# gate7_users = root,admin,devops
# gate8_users = root,admin

# ============================================================
# Time Windows
#
# Optionally restrict when grade 7-8 operations can be performed.
# Format: HH:MM-HH:MM (24-hour)
# ============================================================

# gate7_hours = 06:00-22:00
# gate8_hours = 08:00-18:00

# ============================================================
# Confirmation
#
# Require interactive confirmation for grade 8 operations?
# Values: yes | no
# ============================================================

gate8_confirm = yes
