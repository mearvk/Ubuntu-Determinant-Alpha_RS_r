<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Writer — Rounded square tile, white/silver, embossed pen/document -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFB"/>
      <stop offset="100%" style="stop-color:#E4E8EC"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" 
        stroke="#C8D0D8" stroke-width="1.5"/>
  
  <!-- Document page — embossed -->
  <g filter="url(#emboss)">
    <!-- Page with folded corner -->
    <path d="M 36 24 L 80 24 L 92 36 L 92 104 L 36 104 Z" 
          fill="url(#paper)" stroke="#8A98A4" stroke-width="1.5"/>
    
    <!-- Folded corner -->
    <path d="M 80 24 L 80 36 L 92 36 Z" fill="url(#metal-light)" stroke="#8A98A4" stroke-width="1"/>
    
    <!-- Text lines on page -->
    <line x1="44" y1="46" x2="84" y2="46" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="56" x2="78" y2="56" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="44" y1="66" x2="82" y2="66" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="44" y1="76" x2="72" y2="76" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="44" y1="86" x2="80" y2="86" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="44" y1="96" x2="66" y2="96" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Pen (overlaid, slightly outside page) -->
  <g filter="url(#emboss)" transform="rotate(-30 90 80)">
    <rect x="86" y="40" width="6" height="50" rx="2" fill="url(#metal)" stroke="#6B7B8A" stroke-width="1"/>
    <polygon points="86,90 92,90 89,98" fill="#6B7B8A"/>
    <rect x="86" y="40" width="6" height="8" rx="1" fill="url(#metal-light)"/>
  </g>
</svg>
