<?xml version="1.0" encoding="UTF-8"?>
<!-- JDesk Writer Icon — Word Processor (Blue document with pen) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Document body -->
  <rect x="24" y="12" width="72" height="96" rx="6" ry="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <!-- Document lines -->
  <line x1="38" y1="36" x2="82" y2="36" stroke="#DADCE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="50" x2="78" y2="50" stroke="#DADCE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="64" x2="72" y2="64" stroke="#DADCE0" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="78" x2="68" y2="78" stroke="#DADCE0" stroke-width="3" stroke-linecap="round"/>
  <!-- Pen/Edit indicator -->
  <rect x="74" y="74" width="36" height="8" rx="2" transform="rotate(-45, 92, 78)" fill="#1A73E8"/>
  <polygon points="70,102 74,90 78,94" fill="#1A73E8"/>
  <!-- Corner fold -->
  <path d="M72 12 L96 12 L96 36 Z" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
</svg>
