<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- VSCodium icon — teal/green code editor -->
  <defs>
    <linearGradient id="vscBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F9E8F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B7A6E;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#vscBg)"/>
  <!-- Code bracket left -->
  <polyline points="24,18 14,32 24,46" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code bracket right -->
  <polyline points="40,18 50,32 40,46" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash in middle -->
  <line x1="35" y1="16" x2="29" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
