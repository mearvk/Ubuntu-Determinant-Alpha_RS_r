<?xml version="1.0" encoding="UTF-8"?>
<!-- JDesk Browser Icon — Web Browser (Globe/compass) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Outer circle -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#1A73E8" stroke-width="4"/>
  <!-- Horizontal line (equator) -->
  <ellipse cx="64" cy="64" rx="52" ry="20" fill="none" stroke="#1A73E8" stroke-width="2.5"/>
  <!-- Vertical ellipse (meridian) -->
  <ellipse cx="64" cy="64" rx="20" ry="52" fill="none" stroke="#1A73E8" stroke-width="2.5"/>
  <!-- Vertical center line -->
  <line x1="64" y1="12" x2="64" y2="116" stroke="#1A73E8" stroke-width="2"/>
  <!-- Horizontal center line -->
  <line x1="12" y1="64" x2="116" y2="64" stroke="#1A73E8" stroke-width="2"/>
  <!-- Inner glow -->
  <circle cx="64" cy="64" r="48" fill="#E8F0FE" opacity="0.3"/>
  <!-- Outer ring (bold) -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#1A73E8" stroke-width="5"/>
</svg>
