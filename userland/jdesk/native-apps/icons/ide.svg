<?xml version="1.0" encoding="UTF-8"?>
<!-- JDesk IDE Icon — Development Environment (Code brackets) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background rounded square -->
  <rect x="12" y="12" width="104" height="104" rx="16" ry="16" fill="#1A73E8"/>
  <!-- Left bracket < -->
  <polyline points="50,40 30,64 50,88" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right bracket > -->
  <polyline points="78,40 98,64 78,88" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Slash / -->
  <line x1="70" y1="34" x2="58" y2="94" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
