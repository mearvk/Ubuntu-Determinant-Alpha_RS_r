<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: xargs — Funnel with arrows -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Input arrows (left side) -->
  <line x1="24" y1="44" x2="42" y2="54" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="64" x2="42" y2="64" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="84" x2="42" y2="74" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Funnel -->
  <path d="M42 38 L42 90 L72 72 L72 56 Z" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" stroke-linejoin="round" filter="url(#emboss)"/>
  <!-- Output arrows (right side) -->
  <line x1="72" y1="64" x2="96" y2="64" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="98,64 90,58 90,70" fill="url(#metal)" filter="url(#emboss)"/>
</svg>
