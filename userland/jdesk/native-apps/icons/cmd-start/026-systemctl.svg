<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: systemctl — Rounded square tile, white/silver, power button with circular arrow -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Power button circle with gap at top -->
  <path d="M 64 38 A 28 28 0 1 0 92 66 A 28 28 0 0 0 64 38" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" filter="url(#emboss)" style="stroke-dasharray: 150; stroke-dashoffset: 20;"/>
  <circle cx="64" cy="66" r="28" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" filter="url(#emboss)" stroke-dasharray="132 44" transform="rotate(-90 64 66)"/>
  <!-- Power line -->
  <line x1="64" y1="38" x2="64" y2="56" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" filter="url(#emboss)"/>
  <!-- Circular arrow (refresh indicator) -->
  <path d="M 88 46 A 24 24 0 0 1 92 66" fill="none" stroke="url(#metal-light)" stroke-width="3" stroke-linecap="round" filter="url(#emboss)"/>
  <polygon points="92,60 96,68 88,68" fill="url(#metal-light)" filter="url(#emboss)"/>
</svg>
