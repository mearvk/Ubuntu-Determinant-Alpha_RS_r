<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Python — Intertwined snakes -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Intertwined snakes -->
  <g filter="url(#emboss)">
    <!-- Top snake (lighter) -->
    <path d="M64,30 C64,30 44,30 44,44 L44,56 C44,56 44,64 56,64 L72,64 C72,64 84,64 84,52 L84,44 C84,44 84,30 64,30 Z" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <circle cx="54" cy="40" r="3" fill="#4A5A68"/>
    <!-- Bottom snake (darker) -->
    <path d="M64,98 C64,98 84,98 84,84 L84,72 C84,72 84,64 72,64 L56,64 C56,64 44,64 44,76 L44,84 C44,84 44,98 64,98 Z" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <circle cx="74" cy="88" r="3" fill="#4A5A68"/>
    <!-- Tails -->
    <line x1="44" y1="48" x2="34" y2="48" stroke="url(#light-metal)" stroke-width="4" stroke-linecap="round"/>
    <line x1="84" y1="80" x2="94" y2="80" stroke="url(#dark-metal)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
