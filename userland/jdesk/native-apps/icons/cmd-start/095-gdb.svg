<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: GDB — Bug with magnifying glass -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Bug body -->
  <g filter="url(#emboss)">
    <ellipse cx="52" cy="64" rx="16" ry="22" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2"/>
    <!-- Bug head -->
    <circle cx="52" cy="42" r="8" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
    <!-- Bug legs -->
    <line x1="36" y1="54" x2="28" y2="46" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="64" x2="26" y2="64" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="74" x2="28" y2="82" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="54" x2="74" y2="48" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="64" x2="76" y2="64" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="74" x2="74" y2="80" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <!-- Antennae -->
    <line x1="48" y1="36" x2="42" y2="28" stroke="url(#metal)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56" y1="36" x2="62" y2="28" stroke="url(#metal)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Magnifying glass -->
  <circle cx="84" cy="78" r="14" fill="none" stroke="url(#metal)" stroke-width="3" filter="url(#emboss)"/>
  <line x1="94" y1="88" x2="102" y2="98" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
</svg>
