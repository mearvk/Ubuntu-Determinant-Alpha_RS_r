<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: sftp — Folder with lock and arrows -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Folder tab -->
  <path d="M28 44 L28 40 Q28 36 32 36 L48 36 L52 42 L28 44 Z" fill="url(#metal)"/>
  <!-- Folder body -->
  <rect x="28" y="44" width="60" height="40" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Lock on folder -->
  <rect x="50" y="56" width="16" height="14" rx="3" ry="3" fill="url(#metal)" filter="url(#emboss)"/>
  <path d="M53 56 L53 52 Q53 46 58 46 Q63 46 63 52 L63 56" fill="none" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="58" cy="64" r="2" fill="#FFFFFF"/>
  <!-- Up/down transfer arrows -->
  <line x1="96" y1="40" x2="96" y2="60" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="96,36 90,44 102,44" fill="url(#metal)" filter="url(#emboss)"/>
  <line x1="96" y1="70" x2="96" y2="90" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="96,94 90,86 102,86" fill="url(#metal)" filter="url(#emboss)"/>
</svg>
