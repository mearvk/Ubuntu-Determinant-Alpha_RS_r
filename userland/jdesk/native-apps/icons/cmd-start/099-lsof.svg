<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Lsof — Open files list with eye -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- File list document -->
  <rect x="30" y="32" width="48" height="64" rx="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- File list lines -->
  <line x1="38" y1="46" x2="68" y2="46" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="56" x2="64" y2="56" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="66" x2="70" y2="66" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="76" x2="60" y2="76" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="86" x2="66" y2="86" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <!-- Eye (watching the files) -->
  <g transform="translate(86, 72)" filter="url(#emboss)">
    <path d="M-14 0 C-8 -10 8 -10 14 0 C8 10 -8 10 -14 0 Z" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="url(#metal)"/>
    <circle cx="0" cy="0" r="2" fill="#4A5568"/>
    <circle cx="-1" cy="-1" r="1" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
