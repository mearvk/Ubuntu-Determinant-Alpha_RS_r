<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Wget — Downward arrow into disk -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Downward arrow into disk -->
  <g filter="url(#emboss)">
    <!-- Down arrow -->
    <line x1="64" y1="28" x2="64" y2="62" stroke="url(#dark-metal)" stroke-width="6" stroke-linecap="round"/>
    <polyline points="48,52 64,66 80,52" fill="none" stroke="url(#dark-metal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Disk/drive -->
    <rect x="32" y="72" width="64" height="24" rx="6" ry="6" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <!-- Drive details -->
    <circle cx="84" cy="84" r="4" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <rect x="40" y="80" width="24" height="4" rx="2" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="0.5"/>
    <!-- LED -->
    <circle cx="76" cy="84" r="2" fill="#8A9AA8"/>
  </g>
</svg>
