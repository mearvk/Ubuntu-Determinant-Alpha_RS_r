<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: ping — Rounded square tile, white/silver, radar pulse rings -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Center dot -->
  <circle cx="64" cy="68" r="6" fill="url(#metal)" filter="url(#emboss)"/>
  <!-- Pulse rings -->
  <circle cx="64" cy="68" r="14" fill="none" stroke="url(#metal)" stroke-width="2.5" opacity="0.9" filter="url(#emboss)"/>
  <circle cx="64" cy="68" r="24" fill="none" stroke="url(#metal)" stroke-width="2" opacity="0.65"/>
  <circle cx="64" cy="68" r="34" fill="none" stroke="url(#metal-light)" stroke-width="1.8" opacity="0.45"/>
  <!-- Radar sweep line -->
  <line x1="64" y1="68" x2="64" y2="34" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round" filter="url(#emboss)"/>
  <!-- Radar sweep arc indicator -->
  <path d="M 64 34 A 34 34 0 0 1 92 52" fill="none" stroke="url(#metal-light)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
