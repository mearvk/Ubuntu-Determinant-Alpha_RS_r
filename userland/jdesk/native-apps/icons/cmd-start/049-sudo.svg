<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: sudo — Rounded square tile, white/silver, shield with person arrow up -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Shield shape -->
  <path d="M 64 28 L 94 42 L 94 70 Q 94 96 64 106 Q 34 96 34 70 L 34 42 Z" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2.5" filter="url(#emboss)"/>
  <!-- Person head inside shield -->
  <circle cx="58" cy="52" r="10" fill="url(#tile-bg)" stroke="url(#metal)" stroke-width="2"/>
  <!-- Person body inside shield -->
  <path d="M 44 86 Q 44 68 58 68 Q 72 68 72 86" fill="url(#tile-bg)" stroke="url(#metal)" stroke-width="2"/>
  <!-- Upward arrow -->
  <line x1="78" y1="82" x2="78" y2="56" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="72,62 78,54 84,62" fill="none" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
