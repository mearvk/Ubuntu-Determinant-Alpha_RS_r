<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: du — Rounded square tile, white/silver, folder with size bar -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Folder back -->
  <path d="M 32 44 L 32 38 Q 32 34 36 34 L 54 34 L 58 40 L 92 40 Q 96 40 96 44 L 96 44 L 32 44 Z" fill="url(#metal)" filter="url(#emboss)"/>
  <!-- Folder body -->
  <rect x="32" y="44" width="64" height="40" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <!-- Size bar indicator inside folder -->
  <rect x="40" y="58" width="48" height="8" rx="2" ry="2" fill="url(#tile-bg)" stroke="url(#metal)" stroke-width="1"/>
  <rect x="40" y="58" width="34" height="8" rx="2" ry="2" fill="url(#metal)" opacity="0.6"/>
  <!-- Size label below -->
  <text x="64" y="78" font-family="monospace" font-size="8" fill="url(#metal)" text-anchor="middle">4.2G</text>
  <!-- Bar chart below folder -->
  <rect x="38" y="92" width="8" height="12" rx="1" ry="1" fill="url(#metal)" filter="url(#emboss)"/>
  <rect x="50" y="88" width="8" height="16" rx="1" ry="1" fill="url(#metal)" filter="url(#emboss)"/>
  <rect x="62" y="94" width="8" height="10" rx="1" ry="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="0.5"/>
  <rect x="74" y="90" width="8" height="14" rx="1" ry="1" fill="url(#metal)" filter="url(#emboss)"/>
  <rect x="86" y="96" width="8" height="8" rx="1" ry="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="0.5"/>
</svg>
