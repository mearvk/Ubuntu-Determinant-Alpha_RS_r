<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: SSH — Key with lock -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Key and lock -->
  <g filter="url(#emboss)">
    <!-- Lock body -->
    <rect x="68" y="52" width="28" height="24" rx="4" ry="4" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <!-- Lock shackle -->
    <path d="M74,52 L74,44 A8,8 0 0,1 90,44 L90,52" fill="none" stroke="url(#light-metal)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="82" cy="62" r="3" fill="#4A5A68"/>
    <rect x="81" y="63" width="2" height="6" fill="#4A5A68"/>
    <!-- Key -->
    <circle cx="40" cy="64" r="12" fill="none" stroke="url(#light-metal)" stroke-width="4"/>
    <line x1="52" y1="64" x2="68" y2="64" stroke="url(#light-metal)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="64" x2="60" y2="72" stroke="url(#light-metal)" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="64" x2="65" y2="70" stroke="url(#light-metal)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
