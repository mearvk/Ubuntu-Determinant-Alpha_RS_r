<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Podman — Seal/pod with container -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Pod shape (rounded capsule) -->
  <ellipse cx="64" cy="56" rx="32" ry="24" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Seal face details -->
  <circle cx="54" cy="52" r="3" fill="url(#metal)"/>
  <circle cx="74" cy="52" r="3" fill="url(#metal)"/>
  <ellipse cx="64" cy="60" rx="4" ry="3" fill="url(#metal)"/>
  <!-- Container below (small box) -->
  <rect x="48" y="78" width="32" height="18" rx="3" fill="url(#metal)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <!-- Container lines -->
  <line x1="56" y1="78" x2="56" y2="96" stroke="url(#metal-light)" stroke-width="1"/>
  <line x1="64" y1="78" x2="64" y2="96" stroke="url(#metal-light)" stroke-width="1"/>
  <line x1="72" y1="78" x2="72" y2="96" stroke="url(#metal-light)" stroke-width="1"/>
</svg>
