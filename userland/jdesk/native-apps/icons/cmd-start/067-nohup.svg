<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: nohup — Running person with shield -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Running person -->
  <!-- Head -->
  <circle cx="52" cy="38" r="8" fill="url(#metal)" filter="url(#emboss)"/>
  <!-- Body -->
  <line x1="52" y1="46" x2="52" y2="72" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="52" y1="54" x2="38" y2="48" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="54" x2="64" y2="60" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs (running pose) -->
  <line x1="52" y1="72" x2="40" y2="96" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="72" x2="64" y2="96" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <!-- Shield -->
  <path d="M80 44 L80 72 Q80 88 92 94 Q104 88 104 72 L104 44 Q92 38 80 44 Z" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Checkmark on shield -->
  <polyline points="86,68 90,74 100,60" fill="none" stroke="#6B7B8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
