<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: less — Document with scroll arrows -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Document -->
  <rect x="34" y="28" width="48" height="68" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Document lines -->
  <line x1="42" y1="42" x2="74" y2="42" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="70" y2="52" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="62" x2="74" y2="62" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="72" x2="66" y2="72" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="82" x2="72" y2="82" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <!-- Scroll up arrow -->
  <polygon points="94,40 88,50 100,50" fill="url(#metal)" filter="url(#emboss)"/>
  <!-- Scroll down arrow -->
  <polygon points="94,88 88,78 100,78" fill="url(#metal)" filter="url(#emboss)"/>
  <!-- Scroll track -->
  <line x1="94" y1="52" x2="94" y2="76" stroke="#A8B8C4" stroke-width="2" stroke-linecap="round"/>
</svg>
