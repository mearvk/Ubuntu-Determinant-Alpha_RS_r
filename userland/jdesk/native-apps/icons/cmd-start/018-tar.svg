<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Tar — Compressed archive box -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Archive box -->
  <g filter="url(#emboss)">
    <!-- Box body -->
    <rect x="30" y="44" width="68" height="50" rx="5" ry="5" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <!-- Box lid -->
    <rect x="28" y="36" width="72" height="14" rx="4" ry="4" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <!-- Straps (compression bands) -->
    <rect x="42" y="44" width="6" height="50" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="0.5" opacity="0.7"/>
    <rect x="80" y="44" width="6" height="50" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="0.5" opacity="0.7"/>
    <!-- Compression arrows -->
    <polyline points="50,56 64,50 78,56" fill="none" stroke="#4A5A68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="50,86 64,92 78,86" fill="none" stroke="#4A5A68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Handle -->
    <rect x="56" y="40" width="16" height="6" rx="3" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1"/>
  </g>
</svg>
