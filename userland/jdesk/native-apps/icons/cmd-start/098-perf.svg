<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Perf — Speedometer gauge -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Gauge arc (semicircle) -->
  <g filter="url(#emboss)">
    <path d="M30 82 A34 34 0 1 1 98 82" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
    <!-- Gauge tick marks -->
    <line x1="36" y1="78" x2="42" y2="74" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="60" x2="44" y2="62" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="46" x2="54" y2="52" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="42" x2="64" y2="48" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="76" y1="46" x2="74" y2="52" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="60" x2="84" y2="62" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="86" y2="74" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    <!-- Needle pointing to high -->
    <line x1="64" y1="80" x2="82" y2="52" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
    <!-- Needle center dot -->
    <circle cx="64" cy="80" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2"/>
  </g>
  <!-- Base line -->
  <line x1="30" y1="88" x2="98" y2="88" stroke="url(#metal-light)" stroke-width="2"/>
</svg>
