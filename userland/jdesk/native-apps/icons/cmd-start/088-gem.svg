<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Gem — Ruby gem shape -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Gem shape (pentagon) -->
  <g filter="url(#emboss)">
    <!-- Top flat -->
    <polygon points="44,44 84,44 94,60 64,96 34,60" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2"/>
    <!-- Top facet line -->
    <line x1="44" y1="44" x2="34" y2="60" stroke="url(#metal)" stroke-width="1.5"/>
    <line x1="84" y1="44" x2="94" y2="60" stroke="url(#metal)" stroke-width="1.5"/>
    <!-- Horizontal divide -->
    <line x1="34" y1="60" x2="94" y2="60" stroke="url(#metal)" stroke-width="1.5"/>
    <!-- Lower facets -->
    <line x1="44" y1="44" x2="64" y2="96" stroke="url(#metal)" stroke-width="1"/>
    <line x1="84" y1="44" x2="64" y2="96" stroke="url(#metal)" stroke-width="1"/>
    <line x1="64" y1="44" x2="64" y2="60" stroke="url(#metal)" stroke-width="1"/>
    <line x1="64" y1="60" x2="64" y2="96" stroke="url(#metal)" stroke-width="1.5"/>
  </g>
</svg>
