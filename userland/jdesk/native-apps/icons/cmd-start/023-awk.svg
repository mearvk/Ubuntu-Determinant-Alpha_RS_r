<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Awk — Text columns with funnel -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Text columns with funnel -->
  <g filter="url(#emboss)">
    <!-- Input text columns (left side) -->
    <line x1="24" y1="36" x2="38" y2="36" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="36" x2="52" y2="36" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="46" x2="36" y2="46" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="46" x2="52" y2="46" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="56" x2="34" y2="56" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="56" x2="52" y2="56" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="66" x2="38" y2="66" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="66" x2="52" y2="66" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <!-- Funnel -->
    <path d="M56,30 L56,72 L64,80 L72,72 L72,30 Z" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <line x1="64" y1="80" x2="64" y2="98" stroke="url(#dark-metal)" stroke-width="3" stroke-linecap="round"/>
    <!-- Output (filtered) -->
    <line x1="76" y1="84" x2="100" y2="84" stroke="url(#light-metal)" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="94" x2="96" y2="94" stroke="url(#light-metal)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
