<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: redis — Diamond/cube with R -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <linearGradient id="diamond-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="50%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#8896A4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Diamond/cube shape (isometric) -->
  <!-- Top face -->
  <polygon points="64,28 96,46 64,64 32,46" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" stroke-linejoin="round" filter="url(#emboss)"/>
  <!-- Left face -->
  <polygon points="32,46 64,64 64,92 32,74" fill="url(#metal)" stroke="url(#metal)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right face -->
  <polygon points="96,46 64,64 64,92 96,74" fill="url(#diamond-face)" stroke="url(#metal)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Letter R -->
  <text x="64" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="url(#metal)" filter="url(#emboss)">R</text>
</svg>
