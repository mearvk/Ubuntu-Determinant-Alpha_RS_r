<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Cargo — Crate/box with gear -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Crate box -->
  <rect x="34" y="42" width="44" height="44" rx="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Crate slats -->
  <line x1="34" y1="56" x2="78" y2="56" stroke="url(#metal)" stroke-width="1.5"/>
  <line x1="34" y1="72" x2="78" y2="72" stroke="url(#metal)" stroke-width="1.5"/>
  <line x1="56" y1="42" x2="56" y2="86" stroke="url(#metal)" stroke-width="1.5"/>
  <!-- Gear (top-right overlay) -->
  <g transform="translate(82,46)" filter="url(#emboss)">
    <circle cx="0" cy="0" r="12" fill="url(#metal)"/>
    <circle cx="0" cy="0" r="5" fill="url(#metal-light)"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-14" width="4" height="6" fill="url(#metal)"/>
    <rect x="-2" y="8" width="4" height="6" fill="url(#metal)"/>
    <rect x="-14" y="-2" width="6" height="4" fill="url(#metal)"/>
    <rect x="8" y="-2" width="6" height="4" fill="url(#metal)"/>
    <rect x="6" y="-11" width="5" height="4" rx="1" fill="url(#metal)" transform="rotate(45 8 -9)"/>
    <rect x="-11" y="7" width="5" height="4" rx="1" fill="url(#metal)" transform="rotate(45 -9 9)"/>
    <rect x="6" y="7" width="5" height="4" rx="1" fill="url(#metal)" transform="rotate(-45 8 9)"/>
    <rect x="-11" y="-11" width="5" height="4" rx="1" fill="url(#metal)" transform="rotate(-45 -9 -9)"/>
  </g>
</svg>
