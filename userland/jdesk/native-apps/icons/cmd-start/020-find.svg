<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Find — Magnifying glass on filesystem -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Magnifying glass on filesystem tree -->
  <g filter="url(#emboss)">
    <!-- Filesystem tree -->
    <rect x="28" y="34" width="16" height="12" rx="2" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <line x1="36" y1="46" x2="36" y2="54" stroke="#6B7B8A" stroke-width="2"/>
    <line x1="36" y1="54" x2="30" y2="54" stroke="#6B7B8A" stroke-width="2"/>
    <line x1="36" y1="54" x2="36" y2="66" stroke="#6B7B8A" stroke-width="2"/>
    <rect x="22" y="54" width="12" height="9" rx="2" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <line x1="36" y1="66" x2="30" y2="66" stroke="#6B7B8A" stroke-width="2"/>
    <rect x="22" y="66" width="12" height="9" rx="2" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <line x1="36" y1="60" x2="48" y2="60" stroke="#6B7B8A" stroke-width="2"/>
    <rect x="48" y="56" width="12" height="9" rx="2" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <!-- Magnifying glass -->
    <circle cx="74" cy="62" r="18" fill="none" stroke="url(#dark-metal)" stroke-width="5"/>
    <line x1="86" y1="74" x2="98" y2="90" stroke="url(#dark-metal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Glass reflection -->
    <path d="M66,52 C68,50 72,50 74,52" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
