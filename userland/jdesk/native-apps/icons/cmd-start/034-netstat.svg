<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: netstat — Rounded square tile, white/silver, network connections graph -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Central hub -->
  <rect x="52" y="56" width="24" height="16" rx="3" ry="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Connection lines to endpoints -->
  <line x1="52" y1="64" x2="32" y2="42" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <line x1="52" y1="64" x2="32" y2="86" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <line x1="76" y1="64" x2="96" y2="42" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <line x1="76" y1="64" x2="96" y2="64" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <line x1="76" y1="64" x2="96" y2="86" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Endpoint nodes -->
  <circle cx="32" cy="42" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <circle cx="32" cy="86" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <circle cx="96" cy="42" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <circle cx="96" cy="64" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <circle cx="96" cy="86" r="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <!-- Status indicators -->
  <circle cx="32" cy="42" r="2" fill="#8896A4"/>
  <circle cx="96" cy="42" r="2" fill="#8896A4"/>
  <circle cx="96" cy="64" r="2" fill="#8896A4"/>
</svg>
