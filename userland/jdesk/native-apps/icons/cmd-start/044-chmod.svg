<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: chmod — Rounded square tile, white/silver, lock with permission bits rwx -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Lock shackle -->
  <path d="M 48 56 L 48 46 A 16 16 0 0 1 80 46 L 80 56" fill="none" stroke="url(#metal)" stroke-width="4" stroke-linecap="round" filter="url(#emboss)"/>
  <!-- Lock body -->
  <rect x="42" y="56" width="44" height="32" rx="5" ry="5" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Keyhole -->
  <circle cx="64" cy="68" r="4" fill="url(#metal)"/>
  <rect x="62" y="68" width="4" height="10" rx="1" ry="1" fill="url(#metal)"/>
  <!-- Permission text rwx -->
  <text x="64" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="url(#metal)" text-anchor="middle" filter="url(#emboss)">rwx</text>
</svg>
