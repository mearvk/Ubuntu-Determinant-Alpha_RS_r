<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Kubectl — Ship wheel/helm -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Ship wheel (helm) -->
  <g filter="url(#emboss)">
    <!-- Outer ring -->
    <circle cx="64" cy="64" r="30" fill="none" stroke="url(#metal)" stroke-width="4"/>
    <!-- Inner ring -->
    <circle cx="64" cy="64" r="10" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2.5"/>
    <!-- Spokes (8 directions) -->
    <line x1="64" y1="34" x2="64" y2="54" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="64" y1="74" x2="64" y2="94" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="34" y1="64" x2="54" y2="64" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="74" y1="64" x2="94" y2="64" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="43" y1="43" x2="57" y2="57" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
    <line x1="71" y1="71" x2="85" y2="85" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="43" x2="71" y2="57" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
    <line x1="43" y1="85" x2="57" y2="71" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle pegs at spoke ends -->
    <circle cx="64" cy="32" r="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <circle cx="64" cy="96" r="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <circle cx="32" cy="64" r="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <circle cx="96" cy="64" r="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
  </g>
</svg>
