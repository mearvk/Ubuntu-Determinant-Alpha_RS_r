<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: patch — Document with band-aid -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Document -->
  <rect x="34" y="24" width="44" height="56" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <line x1="42" y1="36" x2="70" y2="36" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="44" x2="66" y2="44" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="70" y2="52" stroke="#8896A4" stroke-width="2" stroke-linecap="round"/>
  <!-- Band-aid -->
  <rect x="38" y="82" width="52" height="18" rx="9" ry="9" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" transform="rotate(-15 64 91)" filter="url(#emboss)"/>
  <!-- Band-aid dots -->
  <circle cx="56" cy="89" r="2" fill="#6B7B8A" transform="rotate(-15 64 91)"/>
  <circle cx="64" cy="89" r="2" fill="#6B7B8A" transform="rotate(-15 64 91)"/>
  <circle cx="72" cy="89" r="2" fill="#6B7B8A" transform="rotate(-15 64 91)"/>
</svg>
