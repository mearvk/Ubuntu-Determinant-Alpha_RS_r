<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: journalctl — Rounded square tile, white/silver, scroll/log document -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Scroll document body -->
  <rect x="40" y="34" width="48" height="64" rx="3" ry="3" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <!-- Scroll curl top -->
  <path d="M 40 37 Q 40 30 47 30 L 81 30 Q 88 30 88 37" fill="none" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scroll curl bottom -->
  <path d="M 40 95 Q 40 102 47 102 L 81 102 Q 88 102 88 95" fill="none" stroke="url(#metal)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Log lines -->
  <line x1="48" y1="46" x2="80" y2="46" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="54" x2="76" y2="54" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="62" x2="78" y2="62" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="70" x2="72" y2="70" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="78" x2="80" y2="78" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="86" x2="68" y2="86" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
</svg>
