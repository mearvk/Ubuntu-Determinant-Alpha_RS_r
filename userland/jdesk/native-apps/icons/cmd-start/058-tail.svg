<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: tail — Document with bottom highlight -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Document -->
  <rect x="38" y="26" width="52" height="72" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Bottom highlight area -->
  <rect x="40" y="72" width="48" height="24" rx="3" ry="3" fill="#8896A4" opacity="0.4"/>
  <!-- Lines (normal top) -->
  <line x1="48" y1="36" x2="80" y2="36" stroke="#A8B8C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="46" x2="74" y2="46" stroke="#A8B8C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="56" x2="78" y2="56" stroke="#A8B8C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="66" x2="70" y2="66" stroke="#A8B8C4" stroke-width="2" stroke-linecap="round"/>
  <!-- Lines (highlighted bottom) -->
  <line x1="48" y1="80" x2="80" y2="80" stroke="#6B7B8A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="88" x2="76" y2="88" stroke="#6B7B8A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
