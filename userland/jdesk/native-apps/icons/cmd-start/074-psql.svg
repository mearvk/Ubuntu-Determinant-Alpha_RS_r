<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: psql — Elephant with cylinder database -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Elephant head (simplified) -->
  <ellipse cx="42" cy="44" rx="16" ry="14" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2" filter="url(#emboss)"/>
  <!-- Elephant ear -->
  <ellipse cx="30" cy="42" rx="8" ry="10" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5"/>
  <!-- Elephant eye -->
  <circle cx="46" cy="40" r="2.5" fill="#6B7B8A"/>
  <!-- Elephant trunk -->
  <path d="M52 52 Q58 58 56 66 Q54 72 50 72" fill="none" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <!-- Database cylinder -->
  <ellipse cx="84" cy="64" rx="20" ry="8" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2"/>
  <rect x="64" y="64" width="40" height="32" fill="url(#metal-light)" stroke="none"/>
  <line x1="64" y1="64" x2="64" y2="96" stroke="url(#metal)" stroke-width="2"/>
  <line x1="104" y1="64" x2="104" y2="96" stroke="url(#metal)" stroke-width="2"/>
  <ellipse cx="84" cy="96" rx="20" ry="8" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="2"/>
  <!-- Middle ellipse line -->
  <ellipse cx="84" cy="80" rx="20" ry="6" fill="none" stroke="url(#metal)" stroke-width="1" opacity="0.6"/>
</svg>
