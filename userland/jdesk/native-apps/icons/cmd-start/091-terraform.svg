<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Terraform — T with infrastructure blocks -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- T letter -->
  <path d="M40 36 L88 36 M64 36 L64 68" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" filter="url(#emboss)"/>
  <!-- Infrastructure blocks below -->
  <rect x="32" y="76" width="18" height="14" rx="2" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <rect x="55" y="76" width="18" height="14" rx="2" fill="url(#metal)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <rect x="78" y="76" width="18" height="14" rx="2" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <!-- Connection lines from T to blocks -->
  <line x1="64" y1="68" x2="41" y2="76" stroke="url(#metal)" stroke-width="1.5"/>
  <line x1="64" y1="68" x2="64" y2="76" stroke="url(#metal)" stroke-width="1.5"/>
  <line x1="64" y1="68" x2="87" y2="76" stroke="url(#metal)" stroke-width="1.5"/>
</svg>
