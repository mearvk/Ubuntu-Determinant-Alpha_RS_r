<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Valgrind — V with memory blocks -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- V letter -->
  <path d="M36 32 L64 72 L92 32" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#emboss)"/>
  <!-- Memory blocks (grid below V) -->
  <g filter="url(#emboss)">
    <rect x="32" y="80" width="12" height="10" rx="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="46" y="80" width="12" height="10" rx="1" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="60" y="80" width="12" height="10" rx="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="74" y="80" width="12" height="10" rx="1" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="88" y="80" width="12" height="10" rx="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="32" y="93" width="12" height="10" rx="1" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="46" y="93" width="12" height="10" rx="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="60" y="93" width="12" height="10" rx="1" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="74" y="93" width="12" height="10" rx="1" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <rect x="88" y="93" width="12" height="10" rx="1" fill="url(#metal)" stroke="url(#metal)" stroke-width="1"/>
  </g>
</svg>
