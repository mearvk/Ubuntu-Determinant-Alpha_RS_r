<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: uniq — Stacked items with minus duplicates -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Stacked rows -->
  <rect x="30" y="32" width="50" height="14" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <rect x="30" y="50" width="50" height="14" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)" opacity="0.5"/>
  <rect x="30" y="68" width="50" height="14" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <rect x="30" y="86" width="50" height="14" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)" opacity="0.5"/>
  <!-- Minus/strike-through on duplicates -->
  <line x1="28" y1="57" x2="82" y2="57" stroke="#6B7B8A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="93" x2="82" y2="93" stroke="#6B7B8A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minus badge -->
  <circle cx="96" cy="64" r="14" fill="url(#metal)" filter="url(#emboss)"/>
  <line x1="88" y1="64" x2="104" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
