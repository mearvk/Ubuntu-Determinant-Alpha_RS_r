<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: ps — Rounded square tile, white/silver, list with process IDs -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Document background -->
  <rect x="34" y="30" width="60" height="72" rx="4" ry="4" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1.5" filter="url(#emboss)"/>
  <!-- Header line -->
  <line x1="40" y1="42" x2="88" y2="42" stroke="url(#metal)" stroke-width="1.5"/>
  <!-- PID column -->
  <text x="44" y="39" font-family="monospace" font-size="8" fill="url(#metal)" font-weight="bold">PID</text>
  <text x="64" y="39" font-family="monospace" font-size="8" fill="url(#metal)" font-weight="bold">CMD</text>
  <!-- Process rows -->
  <text x="44" y="54" font-family="monospace" font-size="8" fill="url(#metal)">1</text>
  <text x="64" y="54" font-family="monospace" font-size="8" fill="url(#metal)">init</text>
  <text x="44" y="66" font-family="monospace" font-size="8" fill="url(#metal)">42</text>
  <text x="64" y="66" font-family="monospace" font-size="8" fill="url(#metal)">bash</text>
  <text x="44" y="78" font-family="monospace" font-size="8" fill="url(#metal)">128</text>
  <text x="64" y="78" font-family="monospace" font-size="8" fill="url(#metal)">ssh</text>
  <text x="44" y="90" font-family="monospace" font-size="8" fill="url(#metal)">256</text>
  <text x="64" y="90" font-family="monospace" font-size="8" fill="url(#metal)">vim</text>
</svg>
