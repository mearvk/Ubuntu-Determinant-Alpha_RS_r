<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Top — Bar chart process monitor -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Process monitor bar chart -->
  <g filter="url(#emboss)">
    <!-- Monitor frame -->
    <rect x="26" y="30" width="76" height="60" rx="4" ry="4" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1.5"/>
    <!-- Screen area -->
    <rect x="30" y="34" width="68" height="52" rx="2" ry="2" fill="#3A4A58"/>
    <!-- Bar chart bars -->
    <rect x="36" y="52" width="8" height="30" fill="url(#light-metal)" opacity="0.9"/>
    <rect x="48" y="44" width="8" height="38" fill="url(#light-metal)" opacity="0.9"/>
    <rect x="60" y="58" width="8" height="24" fill="url(#light-metal)" opacity="0.9"/>
    <rect x="72" y="38" width="8" height="44" fill="url(#light-metal)" opacity="0.9"/>
    <rect x="84" y="62" width="8" height="20" fill="url(#light-metal)" opacity="0.9"/>
    <!-- Header text lines -->
    <line x1="34" y1="38" x2="58" y2="38" stroke="#8A9AA8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="62" y1="38" x2="94" y2="38" stroke="#8A9AA8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Monitor stand -->
    <rect x="54" y="90" width="20" height="4" rx="1" fill="url(#light-metal)" stroke="#6B7B8A" stroke-width="1"/>
    <rect x="48" y="94" width="32" height="4" rx="2" fill="url(#dark-metal)" stroke="#6B7B8A" stroke-width="1"/>
  </g>
</svg>
