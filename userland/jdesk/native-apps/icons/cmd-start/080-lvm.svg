<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: LVM — Layered disk volumes -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Layered disk volumes (3 stacked ellipses) -->
  <g filter="url(#emboss)">
    <!-- Bottom layer -->
    <ellipse cx="64" cy="82" rx="30" ry="12" fill="url(#metal)"/>
    <path d="M34 72 L34 82 A30 12 0 0 0 94 82 L94 72" fill="url(#metal)" stroke="url(#metal)" stroke-width="0.5"/>
    <ellipse cx="64" cy="72" rx="30" ry="12" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <!-- Middle layer -->
    <path d="M38 56 L38 64 A26 10 0 0 0 90 64 L90 56" fill="url(#metal)" stroke="url(#metal)" stroke-width="0.5"/>
    <ellipse cx="64" cy="56" rx="26" ry="10" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
    <!-- Top layer -->
    <path d="M42 42 L42 48 A22 8 0 0 0 86 48 L86 42" fill="url(#metal)" stroke="url(#metal)" stroke-width="0.5"/>
    <ellipse cx="64" cy="42" rx="22" ry="8" fill="url(#metal-light)" stroke="url(#metal)" stroke-width="1"/>
  </g>
</svg>
