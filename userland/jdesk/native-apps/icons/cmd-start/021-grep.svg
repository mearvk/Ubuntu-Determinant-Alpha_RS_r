<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Grep — Magnifying glass on text lines -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="light-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.5" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" stroke="#C8D0D8" stroke-width="1.5"/>
  <!-- Magnifying glass on text lines -->
  <g filter="url(#emboss)">
    <!-- Text lines -->
    <line x1="28" y1="40" x2="72" y2="40" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="52" x2="68" y2="52" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="64" x2="56" y2="64" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="76" x2="50" y2="76" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="88" x2="58" y2="88" stroke="#A8B8C4" stroke-width="3" stroke-linecap="round"/>
    <!-- Highlighted match -->
    <rect x="38" y="59" width="24" height="10" rx="2" fill="#8A9AA8" opacity="0.3"/>
    <!-- Magnifying glass -->
    <circle cx="78" cy="72" r="16" fill="none" stroke="url(#dark-metal)" stroke-width="5"/>
    <line x1="89" y1="83" x2="100" y2="96" stroke="url(#dark-metal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Glass fill -->
    <circle cx="78" cy="72" r="13" fill="#FFFFFF" opacity="0.2"/>
  </g>
</svg>
