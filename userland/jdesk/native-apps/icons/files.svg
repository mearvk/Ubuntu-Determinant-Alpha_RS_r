<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Files — Rounded square tile, white/silver, embossed folder -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <linearGradient id="folder-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8D4E0"/>
      <stop offset="100%" style="stop-color:#98A8B8"/>
    </linearGradient>
    <linearGradient id="folder-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A8B8C8"/>
      <stop offset="100%" style="stop-color:#7888A0"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" 
        stroke="#C8D0D8" stroke-width="1.5"/>
  
  <!-- Folder — embossed metallic -->
  <g filter="url(#emboss)">
    <!-- Back panel of folder -->
    <path d="M 28 42 L 28 96 L 100 96 L 100 42 Z" 
          fill="url(#folder-back)" stroke="#6B7B8A" stroke-width="1.5" rx="3"/>
    
    <!-- Folder tab -->
    <path d="M 28 42 L 28 34 L 56 34 L 62 42 Z" 
          fill="url(#folder-back)" stroke="#6B7B8A" stroke-width="1.5"/>
    
    <!-- Front panel of folder (slightly lower, showing depth) -->
    <path d="M 28 50 L 28 96 L 100 96 L 100 50 Z" 
          fill="url(#folder-front)" stroke="#7A8A98" stroke-width="1.5" rx="2"/>
    
    <!-- Folder clasp / detail line -->
    <line x1="40" y1="50" x2="88" y2="50" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Inner paper peaking out -->
    <rect x="34" y="38" width="40" height="6" rx="1" fill="url(#metal-light)" opacity="0.5"/>
  </g>
</svg>
