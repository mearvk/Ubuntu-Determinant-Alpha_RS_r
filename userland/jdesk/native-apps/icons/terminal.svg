<?xml version="1.0" encoding="UTF-8"?>
<!-- JDesk Terminal Icon — Terminal Emulator (Prompt cursor) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Terminal window background -->
  <rect x="12" y="16" width="104" height="96" rx="8" ry="8" fill="#202124"/>
  <!-- Title bar -->
  <rect x="12" y="16" width="104" height="20" rx="8" ry="8" fill="#3C4043"/>
  <rect x="12" y="28" width="104" height="8" fill="#3C4043"/>
  <!-- Title bar dots -->
  <circle cx="28" cy="26" r="4" fill="#D93025"/>
  <circle cx="42" cy="26" r="4" fill="#F9AB00"/>
  <circle cx="56" cy="26" r="4" fill="#1E8E3E"/>
  <!-- Prompt > -->
  <polyline points="28,58 40,68 28,78" fill="none" stroke="#1E8E3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block -->
  <rect x="48" y="60" width="10" height="16" fill="#FFFFFF" opacity="0.8"/>
  <!-- Previous output line -->
  <line x1="48" y1="86" x2="88" y2="86" stroke="#5F6368" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="96" x2="72" y2="96" stroke="#5F6368" stroke-width="3" stroke-linecap="round"/>
</svg>
