<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- JDesk Icon: Settings — Rounded square tile, white/silver, embossed gear -->
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8ECF0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4D0"/>
      <stop offset="40%" style="stop-color:#8896A4"/>
      <stop offset="100%" style="stop-color:#6B7B8A"/>
    </linearGradient>
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8E0E8"/>
      <stop offset="100%" style="stop-color:#A8B8C4"/>
    </linearGradient>
    <filter id="emboss">
      <feOffset dx="0" dy="1" in="SourceAlpha" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tile background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#tile-bg)" 
        stroke="#C8D0D8" stroke-width="1.5"/>
  
  <!-- Outer ring (Ubuntu circle of friends style) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#metal)" stroke-width="8" filter="url(#emboss)"/>
  
  <!-- Three dots on ring -->
  <circle cx="64" cy="26" r="6" fill="url(#metal-light)" stroke="#7A8A98" stroke-width="1"/>
  <circle cx="31" cy="83" r="6" fill="url(#metal-light)" stroke="#7A8A98" stroke-width="1"/>
  <circle cx="97" cy="83" r="6" fill="url(#metal-light)" stroke="#7A8A98" stroke-width="1"/>
  
  <!-- Inner gear -->
  <circle cx="64" cy="64" r="16" fill="none" stroke="url(#metal)" stroke-width="4"/>
  <circle cx="64" cy="64" r="8" fill="url(#metal-light)" stroke="#7A8A98" stroke-width="1.5"/>
  
  <!-- Gear teeth (simplified) -->
  <rect x="61" y="44" width="6" height="8" rx="1" fill="url(#metal)"/>
  <rect x="61" y="76" width="6" height="8" rx="1" fill="url(#metal)"/>
  <rect x="44" y="61" width="8" height="6" rx="1" fill="url(#metal)"/>
  <rect x="76" y="61" width="8" height="6" rx="1" fill="url(#metal)"/>
  
  <!-- Diagonal gear teeth -->
  <rect x="48" y="48" width="6" height="6" rx="1" fill="url(#metal)" transform="rotate(45 51 51)"/>
  <rect x="74" y="48" width="6" height="6" rx="1" fill="url(#metal)" transform="rotate(45 77 51)"/>
  <rect x="48" y="74" width="6" height="6" rx="1" fill="url(#metal)" transform="rotate(45 51 77)"/>
  <rect x="74" y="74" width="6" height="6" rx="1" fill="url(#metal)" transform="rotate(45 77 77)"/>
</svg>
