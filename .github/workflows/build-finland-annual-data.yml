name: Build Finland annual statistical archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/finland/build_finland_annual_data.py'
      - '.github/workflows/build-finland-annual-data.yml'
  schedule:
    - cron: '43 9 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build annual records
        run: python3 tools/finland/build_finland_annual_data.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add national/finland
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Populate Finland annual statistical data 1965-2026"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"; sleep $((RANDOM % 15 + 5))
          done
          echo "push failed after retries"; exit 1
