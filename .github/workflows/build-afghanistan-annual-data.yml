name: Build Afghanistan annual statistical archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/afghanistan/build_afghanistan_annual_data.py'
      - '.github/workflows/build-afghanistan-annual-data.yml'
  schedule:
    - cron: '45 3 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build annual records
        run: python3 tools/afghanistan/build_afghanistan_annual_data.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add national/afghanistan
          git diff --cached --quiet || git commit -m 'Populate Afghanistan annual statistical data 1965-2026'
          git push
