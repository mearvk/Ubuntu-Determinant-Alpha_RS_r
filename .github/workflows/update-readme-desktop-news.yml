name: Update README desktop news

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Append desktop news
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Desktop News: GNOME and MATE'
          if marker not in text:
              section = '''\n\n---\n\n## Desktop News: GNOME and MATE\n\nThe project is continuing its desktop work with attention to **GNOME** and **MATE Desktop** environments. The goal is a practical, respectful desktop integration layer that keeps the Ubuntu White / JavaFX direction coherent while remaining useful on established Linux desktops.\n\nCurrent desktop priorities include:\n\n- **GNOME** — integration and preview work should respect the GNOME desktop model, application launch conventions, icon presentation, and current Linux session behavior.\n- **MATE Desktop** — integration should preserve the familiar, lightweight MATE experience while providing the same icon, launcher, and Java desktop-preview capabilities.\n- **Shared assets** — desktop references should use the project's PNG/JPEG icon sources where appropriate, with transparent backgrounds preserved and the source assets kept explicit.\n- **JavaFX preview** — the desktop preview remains a full-screen-capable JavaFX interface, with `ESC` available to exit full-screen mode.\n\nWe appreciate the volunteer efforts of **SAS** and **CorpAmerica** as contributors and supporters of open collaboration. As volunteers, we aim to **Pull ahead**: contribute carefully, review what we build, improve interoperability, and leave the desktop in a better state for the next contributor.\n\nThis is a community-minded project statement rather than an assertion of affiliation, endorsement, or employment by any organization named above.\n\n**Max Rupplin — MEARVK LLC — 2026**\n'''
              path.write_text(text.rstrip() + section, encoding='utf-8')
          PY

      - name: Commit README and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/update-readme-desktop-news.yml
          git rm .github/workflows/update-readme-desktop-news.yml
          git commit -m 'docs: add GNOME and MATE desktop news'
          git push
