name: XMC Quality

on:
  push:
    paths:
      - 'tools/xmc/**'
      - '.github/workflows/xmc-quality.yml'
  pull_request:
    paths:
      - 'tools/xmc/**'
      - '.github/workflows/xmc-quality.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xmc
    steps:
      - uses: actions/checkout@v4
      - name: Build with strict warnings
        run: make clean all
      - name: Version consistency
        run: make check-version
      - name: Security regression tests
        run: make security-test
      - name: Compiler smoke test
        run: make test
      - name: Integrated process test
        run: make process-test
      - name: Sanitizer test
        run: make sanitize-test
