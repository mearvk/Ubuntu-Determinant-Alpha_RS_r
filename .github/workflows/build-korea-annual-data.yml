name: Build Korea annual statistical archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/korea/build_korea_annual_data.py'
      - '.github/workflows/build-korea-annual-data.yml'
  schedule:
    - cron: '45 3 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build annual records
        run: python3 tools/korea/build_korea_annual_data.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korea/1965 korea/1966 korea/1967 korea/1968 korea/1969 korea/1970 korea/1971 korea/1972 korea/1973 korea/1974 korea/1975 korea/1976 korea/1977 korea/1978 korea/1979 korea/1980 korea/1981 korea/1982 korea/1983 korea/1984 korea/1985 korea/1986 korea/1987 korea/1988 korea/1989 korea/1990 korea/1991 korea/1992 korea/1993 korea/1994 korea/1995 korea/1996 korea/1997 korea/1998 korea/1999 korea/2000 korea/2001 korea/2002 korea/2003 korea/2004 korea/2005 korea/2006 korea/2007 korea/2008 korea/2009 korea/2010 korea/2011 korea/2012 korea/2013 korea/2014 korea/2015 korea/2016 korea/2017 korea/2018 korea/2019 korea/2020 korea/2021 korea/2022 korea/2023 korea/2024 korea/2025 korea/2026
          git diff --cached --quiet || git commit -m 'Populate Korea annual statistical data 1965-2026'
          git push
