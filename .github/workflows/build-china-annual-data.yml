name: Build China annual statistical archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/china/build_china_annual_data.py'
      - '.github/workflows/build-china-annual-data.yml'
  schedule:
    - cron: '30 3 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build annual records
        run: python3 tools/china/build_china_annual_data.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add china/1965 china/1966 china/1967 china/1968 china/1969 china/1970 china/1971 china/1972 china/1973 china/1974 china/1975 china/1976 china/1977 china/1978 china/1979 china/1980 china/1981 china/1982 china/1983 china/1984 china/1985 china/1986 china/1987 china/1988 china/1989 china/1990 china/1991 china/1992 china/1993 china/1994 china/1995 china/1996 china/1997 china/1998 china/1999 china/2000 china/2001 china/2002 china/2003 china/2004 china/2005 china/2006 china/2007 china/2008 china/2009 china/2010 china/2011 china/2012 china/2013 china/2014 china/2015 china/2016 china/2017 china/2018 china/2019 china/2020 china/2021 china/2022 china/2023 china/2024 china/2025 china/2026
          git diff --cached --quiet || git commit -m 'Populate China annual statistical data 1965-2026'
          git push
