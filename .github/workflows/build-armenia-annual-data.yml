name: Build Armenia annual statistical archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/armenia/build_armenia_annual_data.py'
      - '.github/workflows/build-armenia-annual-data.yml'
  schedule:
    - cron: '29 4 1 * *'

permissions:
  contents: write

concurrency:
  group: annual-archive-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build annual records
        run: python3 tools/armenia/build_armenia_annual_data.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add national/armenia
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m 'Populate Armenia annual statistical data 1965-2026'
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"; sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries"; exit 1
