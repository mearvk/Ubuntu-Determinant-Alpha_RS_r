name: Java Email Server Build

on:
  push:
    paths:
      - 'java/email-servers/**'
      - '.github/workflows/java-email-servers.yml'
  pull_request:
    paths:
      - 'java/email-servers/**'
      - '.github/workflows/java-email-servers.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/email-servers
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -q test package
