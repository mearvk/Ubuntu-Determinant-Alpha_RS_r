name: APT repository

# Builds the precompiled installer binaries into .deb packages, generates a
# signed APT repository index, and publishes it to GitHub Pages so users can
# install with apt-get. See packaging/README.md and docs/apt/index.md.
#
# One-time setup required in the repository (see packaging/SIGNING.md):
#   - Settings > Pages: set Source = "GitHub Actions"
#   - Settings > Secrets and variables > Actions:
#       APT_GPG_PRIVATE_KEY  (ASCII-armored private key)
#       APT_GPG_PASSPHRASE   (its passphrase; may be empty)

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'installer/linux/**'
      - 'packaging/**'
      - 'docs/apt/**'
      - '.github/workflows/apt-repo.yml'
  pull_request:
    paths:
      - 'installer/linux/**'
      - 'packaging/**'
      - 'docs/apt/**'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment.
concurrency:
  group: apt-repo-pages
  cancel-in-progress: true

jobs:
  # Validation-only job: build all 5 .deb packages and the repository index on
  # every PR (and tag/dispatch), WITHOUT signing or publishing. Asserts that
  # each expected package is produced and that the generated index is internally
  # consistent (checksums match the built .debs). This keeps packaging green.
  validate:
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout without LFS blobs: we only build from the C sources
      # and packaging scripts at HEAD, so full history and the large LFS
      # objects are unnecessary and would make checkout very slow on this repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Build .deb packages
        run: |
          chmod +x packaging/build-deb.sh packaging/make-repo.sh
          packaging/build-deb.sh

      - name: Generate repository index
        run: packaging/make-repo.sh

      - name: Assert all 5 packages built and the index is consistent
        run: |
          set -euo pipefail
          expected="os-security-installer git-improved-installer white-installer desktop-install-probe nxtt"

          # 1. Every expected .deb exists in the pool.
          missing=0
          for p in $expected; do
            if ls packaging/out/pool/${p}_*.deb >/dev/null 2>&1; then
              echo "  ok  pool: $p"
            else
              echo "::error::missing .deb for $p"; missing=1
            fi
          done

          # 2. The pool contains exactly 5 packages (no strays, none dropped).
          count=$(ls packaging/out/pool/*.deb 2>/dev/null | wc -l)
          echo "  pool package count: $count (expected 5)"
          [ "$count" -eq 5 ] || { echo "::error::expected 5 .debs, found $count"; missing=1; }

          # 3. The Packages index lists all 5 stanzas.
          pkgs="packaging/out/dists/stable/main/binary-amd64/Packages"
          stanzas=$(grep -c '^Filename: ' "$pkgs" || true)
          echo "  index stanza count: $stanzas (expected 5)"
          [ "$stanzas" -eq 5 ] || { echo "::error::index has $stanzas stanzas, expected 5"; missing=1; }

          # 4. Each SHA256 in the index matches the actual .deb it points at.
          #    (Reads Filename/SHA256 pairs from the Packages file and re-hashes.)
          python3 - "$pkgs" <<'PY'
          import sys, hashlib, pathlib
          root = pathlib.Path("packaging/out")
          text = pathlib.Path(sys.argv[1]).read_text()
          fname = sha = None
          bad = 0
          for line in text.splitlines() + [""]:
              if line.startswith("Filename: "): fname = line.split(" ",1)[1].strip()
              elif line.startswith("SHA256: "):  sha   = line.split(" ",1)[1].strip()
              elif line.strip() == "" and fname:
                  data = (root / fname).read_bytes()
                  actual = hashlib.sha256(data).hexdigest()
                  ok = (actual == sha)
                  print(f"  {'ok ' if ok else 'BAD'} sha256: {fname}")
                  if not ok:
                      print(f"::error::SHA256 mismatch for {fname}: index={sha} actual={actual}")
                      bad += 1
                  fname = sha = None
          sys.exit(1 if bad else 0)
          PY

          # 5. Each .deb is a structurally valid archive: the three required
          #    members must appear in order (debian-binary, then control.tar.*,
          #    then data.tar.*). The compression suffix varies by toolchain —
          #    dpkg-deb defaults to zstd (.zst), the ar+tar fallback uses .gz —
          #    so accept .gz/.zst/.xz/.bz2/.lzma or uncompressed tar.
          for deb in packaging/out/pool/*.deb; do
            m1=$(ar t "$deb" | sed -n 1p)
            m2=$(ar t "$deb" | sed -n 2p)
            m3=$(ar t "$deb" | sed -n 3p)
            ok=1
            [ "$m1" = "debian-binary" ] || ok=0
            case "$m2" in control.tar|control.tar.gz|control.tar.zst|control.tar.xz|control.tar.bz2|control.tar.lzma) : ;; *) ok=0 ;; esac
            case "$m3" in data.tar|data.tar.gz|data.tar.zst|data.tar.xz|data.tar.bz2|data.tar.lzma) : ;; *) ok=0 ;; esac
            if [ "$ok" -eq 1 ]; then
              echo "  ok  members: $(basename "$deb") ($m2 $m3)"
            else
              echo "::error::$(basename "$deb") has unexpected ar members: $m1 $m2 $m3"; missing=1
            fi
          done

          [ "$missing" -eq 0 ] || { echo "::error::packaging validation failed"; exit 1; }
          echo "All 5 packages built and the index is consistent."

  # Publish job: signs and deploys to GitHub Pages. Runs ONLY on tag pushes and
  # manual dispatch — never on pull requests (a fork PR must not touch Pages or
  # the signing secret). Gated behind a green validate job.
  build-and-publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build .deb packages
        env:
          DEB_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/build-deb.sh packaging/make-repo.sh
          packaging/build-deb.sh

      - name: Generate repository index
        run: packaging/make-repo.sh

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY secret is not set. See packaging/SIGNING.md."
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          # Record the key id and export the public key users will import.
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "APT_GPG_KEYID=$KEYID" >> "$GITHUB_ENV"
          gpg --batch --armor --export "$KEYID" > packaging/out/KEY.gpg
          echo "Exported public key $KEYID to packaging/out/KEY.gpg"

      - name: Sign Release (InRelease + Release.gpg)
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          REL="packaging/out/dists/stable/Release"
          # Clearsigned inline index.
          gpg --batch --yes --pinentry-mode loopback \
              ${APT_GPG_PASSPHRASE:+--passphrase "$APT_GPG_PASSPHRASE"} \
              --local-user "$APT_GPG_KEYID" \
              --clearsign -o "${REL%/Release}/InRelease" "$REL"
          # Detached signature.
          gpg --batch --yes --pinentry-mode loopback \
              ${APT_GPG_PASSPHRASE:+--passphrase "$APT_GPG_PASSPHRASE"} \
              --local-user "$APT_GPG_KEYID" \
              -abs -o "${REL%/Release}/Release.gpg" "$REL"
          echo "Signed $REL"

      - name: Assemble Pages site
        run: |
          # Publish the repo under /apt and copy the landing page to the root.
          mkdir -p site/apt
          cp -r packaging/out/* site/apt/
          if [ -f docs/apt/index.md ]; then cp docs/apt/index.md site/apt/README.md; fi
          # A minimal root index so the Pages URL isn't a 404. Built with
          # printf (not a heredoc) so YAML block-scalar indentation can never
          # break a heredoc terminator.
          {
            printf '%s\n' '<!doctype html><meta charset="utf-8">'
            printf '%s\n' '<title>Ubuntu Determinant APT repository</title>'
            printf '%s\n' '<h1>Ubuntu Determinant — APT repository</h1>'
            printf '%s\n' '<p>Signed APT repository for the precompiled installer binaries.</p>'
            printf '%s\n' '<p>Setup instructions: <a href="apt/README.md">apt/README.md</a>.</p>'
          } > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
