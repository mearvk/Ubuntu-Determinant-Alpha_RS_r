name: Installer shell checks

on:
  push:
    paths:
      - 'aptitude/src/*.sh'
      - 'aptitude/health/*.sh'
      - '.github/workflows/installer-shellcheck.yml'
  pull_request:
    paths:
      - 'aptitude/src/*.sh'
      - 'aptitude/health/*.sh'
      - '.github/workflows/installer-shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax checks
        run: |
          bash -n aptitude/src/aptitude.sh
          bash -n aptitude/health/health-check.sh
      - name: ShellCheck
        run: |
          shellcheck aptitude/src/aptitude.sh aptitude/health/health-check.sh
