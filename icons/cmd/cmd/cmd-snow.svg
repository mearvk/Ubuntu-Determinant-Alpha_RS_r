<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="grad-cmd-snow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gloss-cmd-snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow-cmd-snow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Purple border 2px -->
  <rect x="0" y="0" width="24" height="24" rx="3" ry="3" fill="#800080"/>
  <!-- Gradient layer -->
  <rect x="2" y="2" width="20" height="20" rx="2" ry="2" fill="url(#grad-cmd-snow)"/>
  <!-- White inner core -->
  <rect x="4" y="4" width="16" height="16" rx="1.5" ry="1.5" fill="#FFFFFF"/>
  <!-- Pink cubicle center element -->
  <g filter="url(#shadow-cmd-snow)">
    <line x1="12" y1="6" x2="12" y2="18" stroke="#FF69B4" stroke-width="1.3"/><line x1="6" y1="12" x2="18" y2="12" stroke="#FF69B4" stroke-width="1.3"/><line x1="8" y1="8" x2="16" y2="16" stroke="#FFB6C1" stroke-width="1"/><line x1="16" y1="8" x2="8" y2="16" stroke="#FFB6C1" stroke-width="1"/><circle cx="12" cy="12" r="1.5" fill="#FF69B4"/>
  </g>
  <!-- Gloss overlay -->
  <rect x="2" y="2" width="20" height="10" rx="2" ry="2" fill="url(#gloss-cmd-snow)" opacity="0.5"/>
</svg>
