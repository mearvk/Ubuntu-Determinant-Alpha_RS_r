<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Dark purple noir gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0012"/>
      <stop offset="40%" style="stop-color:#1a0a2e"/>
      <stop offset="70%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <!-- Neon sign glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Rain filter -->
    <filter id="rainBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <!-- Window light glow -->
    <filter id="windowGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Street lamp glow -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffdd88;stop-opacity:0.6"/>
      <stop offset="60%" style="stop-color:#ffaa33;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffaa33;stop-opacity:0"/>
    </radialGradient>
    <!-- Fog/mist -->
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="60%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="3840" height="2160" fill="url(#skyGrad)"/>

  <!-- Distant buildings (silhouette layer) -->
  <rect x="0" y="800" width="250" height="1360" fill="#0a0a12"/>
  <rect x="220" y="650" width="180" height="1510" fill="#08080f"/>
  <rect x="380" y="750" width="300" height="1410" fill="#0c0c16"/>
  <rect x="650" y="550" width="200" height="1610" fill="#07070e"/>
  <rect x="820" y="700" width="280" height="1460" fill="#0a0a14"/>
  <rect x="1080" y="480" width="220" height="1680" fill="#060610"/>
  <rect x="1270" y="600" width="350" height="1560" fill="#090912"/>
  <rect x="1590" y="520" width="180" height="1640" fill="#080810"/>
  <rect x="1740" y="680" width="260" height="1480" fill="#0b0b14"/>
  <rect x="1970" y="440" width="300" height="1720" fill="#070710"/>
  <rect x="2240" y="580" width="200" height="1580" fill="#090914"/>
  <rect x="2410" y="500" width="280" height="1660" fill="#060610"/>
  <rect x="2660" y="650" width="220" height="1510" fill="#0a0a12"/>
  <rect x="2850" y="550" width="350" height="1610" fill="#080812"/>
  <rect x="3170" y="620" width="180" height="1540" fill="#0b0b16"/>
  <rect x="3320" y="480" width="260" height="1680" fill="#070710"/>
  <rect x="3550" y="700" width="290" height="1460" fill="#090912"/>

  <!-- Mid-ground buildings with windows -->
  <g>
    <!-- Building left -->
    <rect x="100" y="1000" width="400" height="1160" fill="#121218"/>
    <g fill="#3a2855" opacity="0.7">
      <rect x="130" y="1040" width="30" height="50"/>
      <rect x="180" y="1040" width="30" height="50"/>
      <rect x="230" y="1040" width="30" height="50"/>
      <rect x="130" y="1120" width="30" height="50"/>
      <rect x="230" y="1120" width="30" height="50"/>
      <rect x="180" y="1200" width="30" height="50"/>
      <rect x="130" y="1280" width="30" height="50"/>
      <rect x="230" y="1280" width="30" height="50"/>
      <rect x="180" y="1360" width="30" height="50"/>
      <rect x="130" y="1440" width="30" height="50"/>
      <rect x="230" y="1440" width="30" height="50"/>
    </g>
    <!-- Lit windows (warm) -->
    <g fill="#ffcc66" opacity="0.8" filter="url(#windowGlow)">
      <rect x="180" y="1120" width="30" height="50"/>
      <rect x="130" y="1200" width="30" height="50"/>
      <rect x="230" y="1200" width="30" height="50"/>
      <rect x="180" y="1440" width="30" height="50"/>
    </g>

    <!-- Building center-left -->
    <rect x="600" y="900" width="500" height="1260" fill="#0f0f18"/>
    <g fill="#2a1845" opacity="0.6">
      <rect x="630" y="940" width="35" height="55"/>
      <rect x="690" y="940" width="35" height="55"/>
      <rect x="750" y="940" width="35" height="55"/>
      <rect x="810" y="940" width="35" height="55"/>
      <rect x="630" y="1030" width="35" height="55"/>
      <rect x="690" y="1030" width="35" height="55"/>
      <rect x="750" y="1030" width="35" height="55"/>
      <rect x="810" y="1030" width="35" height="55"/>
      <rect x="630" y="1120" width="35" height="55"/>
      <rect x="690" y="1120" width="35" height="55"/>
      <rect x="750" y="1120" width="35" height="55"/>
      <rect x="810" y="1120" width="35" height="55"/>
    </g>
    <g fill="#ffbb44" opacity="0.9" filter="url(#windowGlow)">
      <rect x="750" y="1030" width="35" height="55"/>
      <rect x="630" y="1120" width="35" height="55"/>
      <rect x="810" y="1120" width="35" height="55"/>
    </g>

    <!-- Building center -->
    <rect x="1200" y="850" width="600" height="1310" fill="#101020"/>
    <g fill="#281640" opacity="0.5">
      <rect x="1240" y="900" width="40" height="60"/>
      <rect x="1310" y="900" width="40" height="60"/>
      <rect x="1380" y="900" width="40" height="60"/>
      <rect x="1450" y="900" width="40" height="60"/>
      <rect x="1520" y="900" width="40" height="60"/>
      <rect x="1240" y="1000" width="40" height="60"/>
      <rect x="1310" y="1000" width="40" height="60"/>
      <rect x="1380" y="1000" width="40" height="60"/>
      <rect x="1450" y="1000" width="40" height="60"/>
      <rect x="1520" y="1000" width="40" height="60"/>
    </g>
    <g fill="#eebb55" opacity="0.85" filter="url(#windowGlow)">
      <rect x="1380" y="900" width="40" height="60"/>
      <rect x="1240" y="1000" width="40" height="60"/>
      <rect x="1520" y="1000" width="40" height="60"/>
    </g>

    <!-- Building right -->
    <rect x="2000" y="950" width="450" height="1210" fill="#0e0e1a"/>
    <rect x="2600" y="880" width="500" height="1280" fill="#111120"/>
    <rect x="3200" y="1000" width="640" height="1160" fill="#0d0d18"/>
  </g>

  <!-- Foreground: Street level -->
  <rect x="0" y="1700" width="3840" height="460" fill="#0a0a0f"/>

  <!-- Wet street reflection -->
  <rect x="0" y="1700" width="3840" height="460" fill="#1a0a2e" opacity="0.15"/>
  <rect x="800" y="1750" width="2200" height="8" fill="#2d1b4e" opacity="0.2" rx="4"/>
  <rect x="600" y="1850" width="2600" height="5" fill="#3a2060" opacity="0.15" rx="3"/>
  <rect x="1000" y="1950" width="1800" height="4" fill="#2d1b4e" opacity="0.1" rx="2"/>

  <!-- Street lamp left -->
  <rect x="500" y="1200" width="8" height="500" fill="#1a1a22"/>
  <ellipse cx="504" cy="1200" rx="60" ry="60" fill="url(#lampGlow)"/>
  <circle cx="504" cy="1195" r="12" fill="#ffdd88" opacity="0.9"/>

  <!-- Street lamp right -->
  <rect x="3200" y="1250" width="8" height="450" fill="#1a1a22"/>
  <ellipse cx="3204" cy="1250" rx="55" ry="55" fill="url(#lampGlow)"/>
  <circle cx="3204" cy="1245" r="11" fill="#ffdd88" opacity="0.85"/>

  <!-- ALIAS INVESTIGATIONS neon sign -->
  <g filter="url(#neonGlow)" transform="translate(1400, 1100)">
    <text x="0" y="0" font-family="monospace" font-size="42" fill="#cc44ff" font-weight="bold" letter-spacing="4">ALIAS</text>
    <text x="0" y="50" font-family="monospace" font-size="28" fill="#9933cc" letter-spacing="3">INVESTIGATIONS</text>
  </g>

  <!-- Jessica Jones silhouette - standing in street, leather jacket, hands in pockets -->
  <g transform="translate(1850, 1100)">
    <!-- Shadow/ground -->
    <ellipse cx="0" cy="600" rx="80" ry="15" fill="#000000" opacity="0.5"/>
    <!-- Boots -->
    <rect x="-25" y="550" width="20" height="50" fill="#0a0a0a"/>
    <rect x="5" y="550" width="20" height="50" fill="#0a0a0a"/>
    <!-- Legs (jeans) -->
    <rect x="-23" y="420" width="18" height="135" fill="#15152a"/>
    <rect x="7" y="420" width="18" height="135" fill="#15152a"/>
    <!-- Torso / leather jacket -->
    <path d="M-35,250 L-30,420 L32,420 L37,250 Q20,230 0,235 Q-15,230 -35,250 Z" fill="#1a1a25"/>
    <!-- Jacket collar -->
    <path d="M-20,240 L0,260 L20,240" fill="none" stroke="#2a2a3a" stroke-width="3"/>
    <!-- Arms in pockets -->
    <path d="M-35,260 L-50,350 L-40,400 L-30,380" fill="#1a1a25"/>
    <path d="M37,260 L52,350 L42,400 L32,380" fill="#1a1a25"/>
    <!-- Hair -->
    <path d="M-22,200 Q-30,180 -25,160 Q-15,140 0,138 Q15,140 25,160 Q30,180 22,200 L20,230 Q0,225 -20,230 Z" fill="#0d0d0d"/>
    <!-- Hair strands falling -->
    <path d="M-22,200 Q-28,220 -25,245" fill="none" stroke="#0d0d0d" stroke-width="4"/>
    <path d="M22,200 Q28,215 24,240" fill="none" stroke="#0d0d0d" stroke-width="4"/>
    <!-- Scarf -->
    <rect x="-12" y="235" width="24" height="20" fill="#4a1a6b" opacity="0.8"/>
  </g>

  <!-- Rain -->
  <g stroke="#8866aa" stroke-width="1" opacity="0.3" filter="url(#rainBlur)">
    <line x1="200" y1="100" x2="195" y2="180"/>
    <line x1="450" y1="200" x2="445" y2="280"/>
    <line x1="700" y1="50" x2="695" y2="130"/>
    <line x1="950" y1="300" x2="945" y2="380"/>
    <line x1="1100" y1="150" x2="1095" y2="230"/>
    <line x1="1350" y1="400" x2="1345" y2="480"/>
    <line x1="1600" y1="100" x2="1595" y2="180"/>
    <line x1="1800" y1="250" x2="1795" y2="330"/>
    <line x1="2050" y1="350" x2="2045" y2="430"/>
    <line x1="2300" y1="150" x2="2295" y2="230"/>
    <line x1="2550" y1="50" x2="2545" y2="130"/>
    <line x1="2800" y1="300" x2="2795" y2="380"/>
    <line x1="3050" y1="200" x2="3045" y2="280"/>
    <line x1="3300" y1="100" x2="3295" y2="180"/>
    <line x1="3550" y1="350" x2="3545" y2="430"/>
    <line x1="3750" y1="250" x2="3745" y2="330"/>
    <line x1="300" y1="500" x2="295" y2="580"/>
    <line x1="550" y1="600" x2="545" y2="680"/>
    <line x1="800" y1="450" x2="795" y2="530"/>
    <line x1="1050" y1="550" x2="1045" y2="630"/>
    <line x1="1250" y1="650" x2="1245" y2="730"/>
    <line x1="1500" y1="500" x2="1495" y2="580"/>
    <line x1="1750" y1="600" x2="1745" y2="680"/>
    <line x1="2000" y1="700" x2="1995" y2="780"/>
    <line x1="2250" y1="550" x2="2245" y2="630"/>
    <line x1="2500" y1="450" x2="2495" y2="530"/>
    <line x1="2750" y1="650" x2="2745" y2="730"/>
    <line x1="3000" y1="500" x2="2995" y2="580"/>
    <line x1="3250" y1="600" x2="3245" y2="680"/>
    <line x1="3500" y1="700" x2="3495" y2="780"/>
    <line x1="150" y1="800" x2="145" y2="880"/>
    <line x1="400" y1="900" x2="395" y2="980"/>
    <line x1="650" y1="850" x2="645" y2="930"/>
    <line x1="900" y1="750" x2="895" y2="830"/>
    <line x1="1150" y1="900" x2="1145" y2="980"/>
    <line x1="1400" y1="800" x2="1395" y2="880"/>
    <line x1="1650" y1="850" x2="1645" y2="930"/>
    <line x1="1900" y1="950" x2="1895" y2="1030"/>
    <line x1="2150" y1="800" x2="2145" y2="880"/>
    <line x1="2400" y1="900" x2="2395" y2="980"/>
    <line x1="2650" y1="850" x2="2645" y2="930"/>
    <line x1="2900" y1="750" x2="2895" y2="830"/>
    <line x1="3150" y1="950" x2="3145" y2="1030"/>
    <line x1="3400" y1="800" x2="3395" y2="880"/>
    <line x1="3650" y1="900" x2="3645" y2="980"/>
  </g>

  <!-- Fog layer -->
  <rect x="0" y="1400" width="3840" height="760" fill="url(#fogGrad)"/>

  <!-- Vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#000000" stroke-width="400" opacity="0.4" rx="800"/>
</svg>
