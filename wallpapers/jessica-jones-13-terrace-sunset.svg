<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Warm terrace evening -->
    <linearGradient id="terraceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="20%" style="stop-color:#301850"/>
      <stop offset="45%" style="stop-color:#803050"/>
      <stop offset="65%" style="stop-color:#cc6040"/>
      <stop offset="80%" style="stop-color:#ee9050"/>
      <stop offset="100%" style="stop-color:#ffcc80"/>
    </linearGradient>
    <!-- String light glow -->
    <filter id="stringGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Warm skin -->
    <linearGradient id="warmSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2d4b4"/>
      <stop offset="100%" style="stop-color:#e4bea0"/>
    </linearGradient>
    <!-- White fabric -->
    <linearGradient id="whiteFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffefb"/>
      <stop offset="50%" style="stop-color:#f8f2ea"/>
      <stop offset="100%" style="stop-color:#f0e8dc"/>
    </linearGradient>
    <!-- Table surface -->
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6a4030"/>
      <stop offset="50%" style="stop-color:#7a4a38"/>
      <stop offset="100%" style="stop-color:#6a4030"/>
    </linearGradient>
    <!-- Foliage -->
    <radialGradient id="plantGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a7030"/>
      <stop offset="100%" style="stop-color:#2a4018"/>
    </radialGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="3840" height="2160" fill="url(#terraceSky)"/>

  <!-- Distant treeline/rooftops -->
  <g fill="#2a1820" opacity="0.5">
    <path d="M0,1300 Q200,1250 400,1280 Q600,1240 800,1270 Q1000,1250 1200,1290 Q1400,1260 1600,1280 Q1800,1240 2000,1270 Q2200,1260 2400,1290 Q2600,1250 2800,1280 Q3000,1260 3200,1290 Q3400,1270 3600,1285 Q3700,1270 3840,1290 L3840,1400 L0,1400 Z"/>
  </g>

  <!-- Terrace floor -->
  <rect x="0" y="1350" width="3840" height="810" fill="#5a3828"/>
  <!-- Stone tiles -->
  <g stroke="#4a2e20" stroke-width="2" opacity="0.3">
    <line x1="0" y1="1500" x2="3840" y2="1500"/>
    <line x1="0" y1="1650" x2="3840" y2="1650"/>
    <line x1="0" y1="1800" x2="3840" y2="1800"/>
    <line x1="0" y1="1950" x2="3840" y2="1950"/>
    <line x1="500" y1="1350" x2="500" y2="2160"/>
    <line x1="1000" y1="1350" x2="1000" y2="2160"/>
    <line x1="1500" y1="1350" x2="1500" y2="2160"/>
    <line x1="2000" y1="1350" x2="2000" y2="2160"/>
    <line x1="2500" y1="1350" x2="2500" y2="2160"/>
    <line x1="3000" y1="1350" x2="3000" y2="2160"/>
    <line x1="3500" y1="1350" x2="3500" y2="2160"/>
  </g>

  <!-- Terrace railing -->
  <rect x="0" y="1300" width="3840" height="8" fill="#3a2518"/>
  <g fill="#3a2518">
    <rect x="200" y="1308" width="6" height="100"/>
    <rect x="350" y="1308" width="6" height="100"/>
    <rect x="500" y="1308" width="6" height="100"/>
    <rect x="650" y="1308" width="6" height="100"/>
    <rect x="800" y="1308" width="6" height="100"/>
    <rect x="3000" y="1308" width="6" height="100"/>
    <rect x="3150" y="1308" width="6" height="100"/>
    <rect x="3300" y="1308" width="6" height="100"/>
    <rect x="3450" y="1308" width="6" height="100"/>
    <rect x="3600" y="1308" width="6" height="100"/>
  </g>
  <rect x="0" y="1405" width="3840" height="6" fill="#3a2518"/>

  <!-- Hanging plants at railing -->
  <g fill="url(#plantGreen)" opacity="0.7">
    <circle cx="300" cy="1330" r="30"/>
    <circle cx="280" cy="1350" r="20"/>
    <circle cx="320" cy="1340" r="18"/>
    <circle cx="3200" cy="1325" r="28"/>
    <circle cx="3180" cy="1345" r="22"/>
    <circle cx="3230" cy="1340" r="18"/>
  </g>
  <!-- Vine trails -->
  <g stroke="#3a6020" stroke-width="2" fill="none" opacity="0.5">
    <path d="M280,1360 Q270,1380 275,1400"/>
    <path d="M320,1355 Q330,1375 325,1395"/>
    <path d="M3180,1355 Q3170,1375 3175,1395"/>
    <path d="M3230,1360 Q3240,1380 3235,1400"/>
  </g>

  <!-- String lights overhead -->
  <g filter="url(#stringGlow)">
    <!-- Wire -->
    <path d="M100,900 Q960,1000 1920,950 Q2880,1000 3740,900" fill="none" stroke="#4a3828" stroke-width="2"/>
    <!-- Bulbs -->
    <circle cx="400" cy="960" r="10" fill="#ffdd88" opacity="0.8"/>
    <circle cx="700" cy="980" r="10" fill="#ffdd88" opacity="0.7"/>
    <circle cx="1000" cy="990" r="10" fill="#ffdd88" opacity="0.8"/>
    <circle cx="1300" cy="985" r="10" fill="#ffdd88" opacity="0.7"/>
    <circle cx="1600" cy="975" r="10" fill="#ffdd88" opacity="0.8"/>
    <circle cx="1920" cy="965" r="10" fill="#ffdd88" opacity="0.9"/>
    <circle cx="2240" cy="975" r="10" fill="#ffdd88" opacity="0.8"/>
    <circle cx="2540" cy="985" r="10" fill="#ffdd88" opacity="0.7"/>
    <circle cx="2840" cy="990" r="10" fill="#ffdd88" opacity="0.8"/>
    <circle cx="3140" cy="980" r="10" fill="#ffdd88" opacity="0.7"/>
    <circle cx="3440" cy="960" r="10" fill="#ffdd88" opacity="0.8"/>
  </g>

  <!-- Table (wooden, rustic) -->
  <path d="M1200,1550 L1200,1450 L2640,1450 L2640,1550 Z" fill="url(#tableWood)"/>
  <rect x="1250" y="1550" width="15" height="200" fill="#5a3828"/>
  <rect x="2575" y="1550" width="15" height="200" fill="#5a3828"/>

  <!-- Table items -->
  <!-- Champagne/sparkling in ice bucket -->
  <g transform="translate(1900, 1350)">
    <ellipse cx="0" cy="50" rx="35" ry="15" fill="#c0c0c0"/>
    <rect x="-30" y="0" width="60" height="50" fill="#b0b0b0" rx="5"/>
    <rect x="-8" y="-40" width="16" height="45" fill="#2a4020"/>
    <rect x="-5" y="-50" width="10" height="12" fill="#c8a050"/>
    <!-- Ice -->
    <g fill="#d0e8ff" opacity="0.3">
      <circle cx="-10" cy="20" r="8"/>
      <circle cx="12" cy="15" r="7"/>
      <circle cx="0" cy="30" r="6"/>
    </g>
  </g>

  <!-- Two champagne flutes -->
  <g transform="translate(1750, 1360)">
    <rect x="-2" y="0" width="4" height="50" fill="#d0c8c0"/>
    <ellipse cx="0" cy="52" rx="12" ry="4" fill="#d0c8c0"/>
    <path d="M-8,-30 L-5,0 L5,0 L8,-30 Z" fill="#ffee88" opacity="0.2"/>
    <ellipse cx="0" cy="-30" rx="8" ry="3" fill="#ffffff" opacity="0.1"/>
  </g>
  <g transform="translate(2050, 1365)">
    <rect x="-2" y="0" width="4" height="48" fill="#d0c8c0"/>
    <ellipse cx="0" cy="50" rx="12" ry="4" fill="#d0c8c0"/>
    <path d="M-8,-28 L-5,0 L5,0 L8,-28 Z" fill="#ffee88" opacity="0.2"/>
    <ellipse cx="0" cy="-28" rx="8" ry="3" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- Plates with food -->
  <ellipse cx="1500" cy="1470" rx="90" ry="30" fill="#f8f4ee" stroke="#e0d8cc" stroke-width="2"/>
  <!-- Food suggestion -->
  <g opacity="0.6">
    <ellipse cx="1480" cy="1460" rx="25" ry="10" fill="#8b4020"/>
    <ellipse cx="1520" cy="1465" rx="20" ry="8" fill="#6a8030"/>
    <circle cx="1500" cy="1455" r="6" fill="#cc8040"/>
  </g>

  <ellipse cx="2350" cy="1470" rx="90" ry="30" fill="#f8f4ee" stroke="#e0d8cc" stroke-width="2"/>
  <g opacity="0.6">
    <ellipse cx="2330" cy="1460" rx="22" ry="9" fill="#cc6040"/>
    <ellipse cx="2370" cy="1465" rx="18" ry="8" fill="#4a7030"/>
    <circle cx="2350" cy="1455" r="5" fill="#ffcc60"/>
  </g>

  <!-- Bread basket center -->
  <ellipse cx="1920" cy="1460" rx="50" ry="18" fill="#8b6030"/>
  <g fill="#d4a050" opacity="0.7">
    <ellipse cx="1910" cy="1450" rx="15" ry="8"/>
    <ellipse cx="1935" cy="1452" rx="12" ry="7"/>
  </g>

  <!-- Her - standing/leaning at terrace railing, looking over shoulder toward table/viewer -->
  <!-- White dress, very casual, wind in hair, golden hour light -->
  <g transform="translate(1100, 700)">
    <!-- Hair blowing slightly in breeze -->
    <path d="M-35,70 Q-48,120 -42,200 Q-40,280 -36,350" fill="#1a1014"/>
    <path d="M35,65 Q50,100 55,160 Q58,200 52,250" fill="#1a1014"/>
    <!-- Wind-blown strand -->
    <path d="M30,60 Q55,50 70,60 Q80,70 75,80" fill="#1a1014" opacity="0.7"/>
    
    <!-- Head (slightly turned, 3/4 view looking back) -->
    <ellipse cx="5" cy="50" rx="34" ry="42" fill="url(#warmSkin)"/>
    
    <!-- Hair crown -->
    <path d="M-30,40 Q-35,20 -28,5 Q-12,-8 5,-10 Q20,-8 32,5 Q38,20 35,40" fill="#1a1014"/>
    
    <!-- Eyes (warm, inviting, looking over shoulder) -->
    <ellipse cx="-5" cy="46" rx="5" ry="3.5" fill="#3a2820"/>
    <ellipse cx="15" cy="44" rx="4.5" ry="3" fill="#3a2820"/>
    <circle cx="-5" cy="45" r="1.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="15" cy="43" r="1.3" fill="#ffffff" opacity="0.5"/>
    <!-- Eyebrows -->
    <path d="M-11,39 Q-5,36 1,38" fill="none" stroke="#2a1a14" stroke-width="1.5"/>
    <path d="M10,37 Q15,35 20,38" fill="none" stroke="#2a1a14" stroke-width="1.5"/>
    
    <!-- Nose (3/4) -->
    <path d="M5,46 L3,60 L6,60" fill="none" stroke="#d4a888" stroke-width="1"/>
    
    <!-- Smile (relaxed, genuine) -->
    <path d="M-4,68 Q5,76 14,70" fill="#c87060" opacity="0.6"/>
    
    <!-- Neck/shoulders -->
    <path d="M-8,85 L-10,110 L18,110 L16,85" fill="url(#warmSkin)"/>
    
    <!-- White dress - flowy, mid-length, casual evening -->
    <path d="M-50,110 Q-60,150 -65,250 Q-70,400 -80,550 Q-85,620 -75,650 L75,650 Q85,620 80,550 Q70,400 65,250 Q60,150 50,110 Q25,102 5,104 Q-20,102 -50,110 Z" fill="url(#whiteFabric)"/>
    <!-- Thin straps -->
    <line x1="-15" y1="85" x2="-35" y2="110" stroke="#f0e8dc" stroke-width="4"/>
    <line x1="18" y1="83" x2="38" y2="108" stroke="#f0e8dc" stroke-width="4"/>
    <!-- Dress movement (wind catching it slightly) -->
    <path d="M-65,400 Q-80,420 -85,450" fill="none" stroke="#e8e0d4" stroke-width="1.5" opacity="0.5"/>
    <path d="M65,380 Q80,400 85,430" fill="none" stroke="#e8e0d4" stroke-width="1.5" opacity="0.5"/>
    <!-- Waist definition -->
    <path d="M-50,200 Q5,215 50,200" fill="none" stroke="#e0d8cc" stroke-width="1" opacity="0.4"/>
    
    <!-- Arms -->
    <!-- Left arm resting on railing -->
    <path d="M-50,120 Q-70,180 -80,250 Q-85,300 -78,320" fill="url(#warmSkin)"/>
    <!-- Right arm relaxed -->
    <path d="M50,120 Q60,180 55,250 Q52,300 55,330" fill="url(#warmSkin)"/>
    
    <!-- Sunset golden light catching her face/dress edge -->
    <ellipse cx="30" cy="200" rx="80" ry="200" fill="#ffcc66" opacity="0.04"/>
  </g>

  <!-- Companion at table (casual male silhouette, relaxed) -->
  <g transform="translate(2400, 1050)" opacity="0.5">
    <ellipse cx="0" cy="50" rx="26" ry="32" fill="#2a1a12"/>
    <path d="M-30,85 L-25,280 L25,280 L30,85 Q15,78 0,80 Q-15,78 -30,85 Z" fill="#1a1210"/>
    <path d="M-25,80 Q0,70 25,80" fill="#1a1210"/>
    <!-- Casual shirt collar -->
    <path d="M-15,82 L0,90 L15,82" fill="none" stroke="#3a2a20" stroke-width="2"/>
  </g>

  <!-- Sunset color wash -->
  <rect width="3840" height="2160" fill="#ff8040" opacity="0.03"/>

  <!-- Warm vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#1a0a05" stroke-width="300" opacity="0.35" rx="800"/>
</svg>
