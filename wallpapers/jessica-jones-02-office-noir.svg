<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Deep noir interior gradient -->
    <linearGradient id="roomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0612"/>
      <stop offset="50%" style="stop-color:#12091e"/>
      <stop offset="100%" style="stop-color:#080510"/>
    </linearGradient>
    <!-- Bourbon amber glow -->
    <radialGradient id="bourbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#cc8833;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#cc8833;stop-opacity:0"/>
    </radialGradient>
    <!-- Desk lamp light cone -->
    <radialGradient id="deskLamp" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffcc66;stop-opacity:0.25"/>
      <stop offset="40%" style="stop-color:#ffaa33;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    <!-- Window light (bluish moonlight) -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334488;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a2244;stop-opacity:0.1"/>
    </linearGradient>
    <!-- Glass refraction -->
    <filter id="glassRefract">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <!-- Shadow -->
    <filter id="dropShadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Room background -->
  <rect width="3840" height="2160" fill="url(#roomGrad)"/>

  <!-- Floor -->
  <path d="M0,1500 L3840,1500 L3840,2160 L0,2160 Z" fill="#0d0815"/>
  <!-- Floor wood grain lines -->
  <g stroke="#1a1020" stroke-width="1" opacity="0.4">
    <line x1="0" y1="1600" x2="3840" y2="1600"/>
    <line x1="0" y1="1700" x2="3840" y2="1700"/>
    <line x1="0" y1="1800" x2="3840" y2="1800"/>
    <line x1="0" y1="1900" x2="3840" y2="1900"/>
    <line x1="0" y1="2000" x2="3840" y2="2000"/>
    <line x1="0" y1="2100" x2="3840" y2="2100"/>
  </g>

  <!-- Back wall -->
  <rect x="0" y="200" width="3840" height="1300" fill="#0f0a1a" opacity="0.8"/>

  <!-- Window (back wall, right side) - city visible beyond -->
  <rect x="2400" y="350" width="800" height="1000" fill="#0a1025"/>
  <!-- Window frame -->
  <rect x="2400" y="350" width="800" height="1000" fill="none" stroke="#1a1428" stroke-width="12"/>
  <line x1="2800" y1="350" x2="2800" y2="1350" stroke="#1a1428" stroke-width="8"/>
  <line x1="2400" y1="850" x2="3200" y2="850" stroke="#1a1428" stroke-width="8"/>
  <!-- City through window -->
  <rect x="2412" y="362" width="376" height="476" fill="#060a18"/>
  <rect x="2812" y="362" width="376" height="476" fill="#060a18"/>
  <rect x="2412" y="862" width="376" height="476" fill="#060a18"/>
  <rect x="2812" y="862" width="376" height="476" fill="#060a18"/>
  <!-- Building silhouettes through window -->
  <rect x="2430" y="500" width="60" height="340" fill="#0a0f22"/>
  <rect x="2500" y="450" width="80" height="390" fill="#080c1e"/>
  <rect x="2590" y="520" width="50" height="320" fill="#0c1025"/>
  <rect x="2650" y="470" width="70" height="370" fill="#090d20"/>
  <rect x="2830" y="480" width="75" height="360" fill="#0a0f22"/>
  <rect x="2920" y="430" width="90" height="410" fill="#080c1e"/>
  <rect x="3030" y="510" width="60" height="330" fill="#0b1024"/>
  <rect x="3100" y="460" width="70" height="380" fill="#090d20"/>
  <!-- Moonlight cast from window -->
  <rect x="2400" y="350" width="800" height="1000" fill="url(#moonGrad)"/>
  <!-- Moonlight on floor -->
  <path d="M2400,1500 L2200,2160 L3400,2160 L3200,1500 Z" fill="#1a2244" opacity="0.08"/>

  <!-- Desk -->
  <rect x="800" y="1200" width="1400" height="40" fill="#1a1220" filter="url(#dropShadow)"/>
  <!-- Desk legs -->
  <rect x="850" y="1240" width="20" height="260" fill="#151020"/>
  <rect x="2130" y="1240" width="20" height="260" fill="#151020"/>

  <!-- Desk lamp -->
  <rect x="900" y="1050" width="6" height="150" fill="#2a2030"/>
  <path d="M870,1050 Q903,1020 936,1050" fill="#2a2030"/>
  <ellipse cx="903" cy="1050" rx="80" ry="80" fill="url(#bourbonGlow)"/>
  <circle cx="903" cy="1045" r="8" fill="#ffcc66" opacity="0.7"/>

  <!-- Lamp light cone on desk -->
  <ellipse cx="1200" cy="1200" rx="500" ry="200" fill="url(#deskLamp)"/>

  <!-- Bourbon bottle -->
  <g transform="translate(1050, 1060)">
    <rect x="0" y="50" width="40" height="90" fill="#2a1800" opacity="0.9"/>
    <rect x="5" y="55" width="30" height="80" fill="#4a2800" opacity="0.6"/>
    <rect x="12" y="20" width="16" height="35" fill="#1a1000"/>
    <rect x="14" y="10" width="12" height="12" fill="#1a1000"/>
    <!-- Bourbon color inside -->
    <rect x="8" y="80" width="24" height="40" fill="#883300" opacity="0.5"/>
  </g>

  <!-- Glass with bourbon -->
  <g transform="translate(1130, 1130)" filter="url(#glassRefract)">
    <path d="M0,70 L5,0 L45,0 L50,70 Z" fill="#ffffff" opacity="0.08"/>
    <path d="M3,70 L8,30 L42,30 L47,70 Z" fill="#aa6600" opacity="0.35"/>
    <!-- Glass rim highlight -->
    <ellipse cx="25" cy="0" rx="20" ry="4" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Scattered papers/photos on desk -->
  <rect x="1250" y="1170" width="120" height="80" fill="#1a1520" transform="rotate(-5, 1310, 1210)"/>
  <rect x="1400" y="1165" width="100" height="70" fill="#1c1625" transform="rotate(3, 1450, 1200)"/>
  <rect x="1350" y="1180" width="90" height="60" fill="#181222" transform="rotate(-8, 1395, 1210)"/>

  <!-- Camera on desk -->
  <g transform="translate(1700, 1130)">
    <rect x="0" y="20" width="80" height="50" fill="#0d0d12" rx="5"/>
    <rect x="20" y="0" width="40" height="25" fill="#0f0f15" rx="3"/>
    <circle cx="40" cy="45" r="18" fill="#0a0a0f" stroke="#1a1a25" stroke-width="2"/>
    <circle cx="40" cy="45" r="8" fill="#1a1a22"/>
  </g>

  <!-- Jessica's silhouette - seated at desk, leaning back -->
  <g transform="translate(1500, 800)">
    <!-- Chair back -->
    <rect x="-60" y="200" width="120" height="250" fill="#0d0a15" rx="10"/>
    <!-- Body leaning back -->
    <path d="M-40,250 L-35,400 L35,400 L40,250 Q20,235 0,238 Q-20,235 -40,250 Z" fill="#111118"/>
    <!-- Leather jacket texture -->
    <line x1="-30" y1="280" x2="-25" y2="380" stroke="#1a1a22" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="280" x2="25" y2="380" stroke="#1a1a22" stroke-width="1" opacity="0.5"/>
    <!-- Left arm on armrest -->
    <path d="M-40,280 L-70,340 L-65,400 L-50,390" fill="#111118"/>
    <!-- Right arm holding glass (reaching toward desk) -->
    <path d="M40,280 L80,360 L100,380 L95,390" fill="#111118"/>
    <!-- Head -->
    <ellipse cx="0" cy="220" rx="28" ry="35" fill="#0d0d12"/>
    <!-- Hair falling -->
    <path d="M-28,220 Q-35,250 -30,280" fill="none" stroke="#0a0a0f" stroke-width="6"/>
    <path d="M28,220 Q35,245 30,270" fill="none" stroke="#0a0a0f" stroke-width="5"/>
    <path d="M-20,190 Q-25,175 -15,165 Q5,155 20,165 Q30,175 25,190" fill="#0a0a0f"/>
  </g>

  <!-- "ALIAS INVESTIGATIONS" on frosted glass door (far left) -->
  <rect x="50" y="400" width="400" height="900" fill="#0f0a1a" opacity="0.6"/>
  <rect x="50" y="400" width="400" height="900" fill="none" stroke="#1a1428" stroke-width="6"/>
  <g transform="translate(100, 700)" opacity="0.4">
    <text x="0" y="0" font-family="serif" font-size="32" fill="#9966cc" letter-spacing="2">ALIAS</text>
    <text x="0" y="40" font-family="serif" font-size="18" fill="#7744aa" letter-spacing="1">INVESTIGATIONS</text>
  </g>

  <!-- Ambient dust particles in lamp light -->
  <g fill="#ffcc88" opacity="0.15">
    <circle cx="1000" cy="1100" r="2"/>
    <circle cx="1150" cy="1080" r="1.5"/>
    <circle cx="1050" cy="1150" r="1"/>
    <circle cx="1200" cy="1090" r="1.8"/>
    <circle cx="950" cy="1130" r="1.2"/>
    <circle cx="1100" cy="1060" r="1"/>
    <circle cx="1300" cy="1120" r="1.5"/>
    <circle cx="1250" cy="1070" r="1.3"/>
  </g>

  <!-- Vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#000000" stroke-width="500" opacity="0.5" rx="900"/>
</svg>
