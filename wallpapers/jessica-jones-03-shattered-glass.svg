<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Shattered glass radial -->
    <radialGradient id="impactCenter" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#6633aa;stop-opacity:0.4"/>
      <stop offset="30%" style="stop-color:#3a1a6b;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0a0012;stop-opacity:0"/>
    </radialGradient>
    <!-- Deep purple background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" style="stop-color:#1a0a30"/>
      <stop offset="100%" style="stop-color:#050008"/>
    </radialGradient>
    <!-- Glass shard shine -->
    <linearGradient id="shardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#9966dd;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </linearGradient>
    <!-- Power glow -->
    <filter id="powerGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shard edge glow -->
    <filter id="edgeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#bgGrad)"/>

  <!-- Impact point energy -->
  <ellipse cx="1920" cy="970" rx="600" ry="500" fill="url(#impactCenter)"/>

  <!-- Radiating crack lines from center (fist impact point) -->
  <g stroke="#7744bb" stroke-width="2" opacity="0.6" filter="url(#edgeGlow)">
    <!-- Major cracks radiating outward -->
    <line x1="1920" y1="970" x2="800" y2="200"/>
    <line x1="1920" y1="970" x2="400" y2="600"/>
    <line x1="1920" y1="970" x2="200" y2="1100"/>
    <line x1="1920" y1="970" x2="500" y2="1700"/>
    <line x1="1920" y1="970" x2="1000" y2="2000"/>
    <line x1="1920" y1="970" x2="1500" y2="2100"/>
    <line x1="1920" y1="970" x2="2400" y2="2100"/>
    <line x1="1920" y1="970" x2="2900" y2="1900"/>
    <line x1="1920" y1="970" x2="3400" y2="1600"/>
    <line x1="1920" y1="970" x2="3600" y2="1000"/>
    <line x1="1920" y1="970" x2="3500" y2="500"/>
    <line x1="1920" y1="970" x2="3100" y2="200"/>
    <line x1="1920" y1="970" x2="2500" y2="100"/>
    <line x1="1920" y1="970" x2="1400" y2="100"/>
    <line x1="1920" y1="970" x2="1000" y2="300"/>
    <line x1="1920" y1="970" x2="300" y2="1500"/>
    <line x1="1920" y1="970" x2="3700" y2="700"/>
    <line x1="1920" y1="970" x2="3300" y2="1300"/>
  </g>

  <!-- Secondary crack branches -->
  <g stroke="#5533aa" stroke-width="1.5" opacity="0.4">
    <line x1="1360" y1="585" x2="1100" y2="400"/>
    <line x1="1360" y1="585" x2="1200" y2="900"/>
    <line x1="1160" y1="785" x2="800" y2="900"/>
    <line x1="1160" y1="785" x2="900" y2="600"/>
    <line x1="2480" y1="585" x2="2700" y2="400"/>
    <line x1="2480" y1="585" x2="2800" y2="700"/>
    <line x1="2660" y1="1285" x2="3000" y2="1100"/>
    <line x1="2660" y1="1285" x2="2900" y2="1500"/>
    <line x1="1210" y1="1485" x2="900" y2="1600"/>
    <line x1="1210" y1="1485" x2="1100" y2="1200"/>
    <line x1="2160" y1="1535" x2="2400" y2="1800"/>
    <line x1="2160" y1="1535" x2="2000" y2="1800"/>
    <line x1="1560" y1="435" x2="1400" y2="200"/>
    <line x1="2280" y1="435" x2="2500" y2="200"/>
  </g>

  <!-- Tertiary micro-cracks -->
  <g stroke="#4422aa" stroke-width="1" opacity="0.3">
    <line x1="1640" y1="770" x2="1500" y2="700"/>
    <line x1="2200" y1="770" x2="2350" y2="650"/>
    <line x1="1640" y1="1170" x2="1450" y2="1300"/>
    <line x1="2200" y1="1170" x2="2400" y2="1250"/>
    <line x1="1780" y1="600" x2="1700" y2="450"/>
    <line x1="2060" y1="600" x2="2150" y2="450"/>
    <line x1="1780" y1="1340" x2="1650" y2="1500"/>
    <line x1="2060" y1="1340" x2="2200" y2="1500"/>
  </g>

  <!-- Concentric ring cracks around impact -->
  <g fill="none" stroke="#6644bb" stroke-width="1.5" opacity="0.35">
    <ellipse cx="1920" cy="970" rx="150" ry="130"/>
    <ellipse cx="1920" cy="970" rx="300" ry="260"/>
    <ellipse cx="1920" cy="970" rx="500" ry="430"/>
    <ellipse cx="1920" cy="970" rx="750" ry="650"/>
  </g>

  <!-- Glass shards floating/falling -->
  <g fill="url(#shardShine)" opacity="0.6">
    <!-- Large shards -->
    <polygon points="1700,700 1750,680 1770,730 1720,750"/>
    <polygon points="2100,650 2160,630 2180,690 2120,710"/>
    <polygon points="1600,1100 1650,1070 1680,1130 1620,1150"/>
    <polygon points="2250,1050 2310,1030 2330,1090 2270,1110"/>
    <polygon points="1500,500 1560,470 1590,540 1530,560"/>
    <polygon points="2350,450 2420,430 2440,500 2370,520"/>
    <polygon points="1400,1350 1460,1320 1490,1390 1430,1410"/>
    <polygon points="2500,1300 2560,1270 2580,1340 2520,1360"/>
  </g>
  <!-- Smaller shards -->
  <g fill="#8855cc" opacity="0.4">
    <polygon points="1800,500 1820,490 1830,510 1810,520"/>
    <polygon points="2050,480 2070,470 2080,495 2060,505"/>
    <polygon points="1650,1300 1670,1290 1680,1310 1660,1320"/>
    <polygon points="2200,1350 2220,1340 2230,1365 2210,1375"/>
    <polygon points="1300,800 1320,790 1330,815 1310,825"/>
    <polygon points="2550,850 2570,840 2580,865 2560,875"/>
    <polygon points="1100,1000 1120,990 1130,1015 1110,1025"/>
    <polygon points="2750,1000 2770,990 2780,1015 2760,1025"/>
    <polygon points="1450,350 1470,340 1480,365 1460,375"/>
    <polygon points="2400,300 2420,290 2430,315 2410,325"/>
    <polygon points="1350,1600 1370,1590 1380,1615 1360,1625"/>
    <polygon points="2500,1600 2520,1590 2530,1615 2510,1625"/>
  </g>

  <!-- Jessica's fist at impact center -->
  <g transform="translate(1920, 970)" filter="url(#powerGlow)">
    <!-- Fist shape (knuckle-forward perspective) -->
    <ellipse cx="0" cy="0" rx="45" ry="40" fill="#1a1020"/>
    <!-- Knuckles -->
    <circle cx="-18" cy="-10" r="10" fill="#150d1a"/>
    <circle cx="0" cy="-14" r="10" fill="#150d1a"/>
    <circle cx="18" cy="-10" r="10" fill="#150d1a"/>
    <!-- Thumb -->
    <ellipse cx="-28" cy="10" rx="8" ry="14" fill="#1a1020" transform="rotate(-20,-28,10)"/>
    <!-- Wrist/forearm trailing -->
    <rect x="-30" y="30" width="60" height="100" fill="#111118" rx="15"/>
    <!-- Leather jacket sleeve -->
    <rect x="-35" y="80" width="70" height="80" fill="#0d0a14" rx="5"/>
    <!-- Power energy around fist -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#9955ee" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#7733cc" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#5522aa" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Energy particles from impact -->
  <g fill="#bb88ff" opacity="0.6" filter="url(#edgeGlow)">
    <circle cx="1820" cy="900" r="4"/>
    <circle cx="2020" cy="880" r="3"/>
    <circle cx="1850" cy="1050" r="3.5"/>
    <circle cx="2000" cy="1060" r="2.5"/>
    <circle cx="1780" cy="950" r="2"/>
    <circle cx="2070" cy="980" r="3"/>
    <circle cx="1900" cy="830" r="2.5"/>
    <circle cx="1950" cy="1100" r="2"/>
    <circle cx="1750" cy="1020" r="3"/>
    <circle cx="2100" cy="920" r="2.5"/>
    <circle cx="1860" cy="1120" r="2"/>
    <circle cx="1980" cy="820" r="3"/>
  </g>

  <!-- Scattered dust/debris -->
  <g fill="#4422aa" opacity="0.25">
    <circle cx="1500" cy="600" r="1.5"/>
    <circle cx="2300" cy="550" r="1"/>
    <circle cx="1300" cy="900" r="1.2"/>
    <circle cx="2600" cy="850" r="1.5"/>
    <circle cx="1200" cy="1200" r="1"/>
    <circle cx="2700" cy="1150" r="1.3"/>
    <circle cx="1400" cy="1500" r="1.5"/>
    <circle cx="2500" cy="1500" r="1"/>
    <circle cx="1100" cy="700" r="1.2"/>
    <circle cx="2800" cy="700" r="1.5"/>
  </g>

  <!-- Title text integrated into shatter pattern -->
  <g filter="url(#edgeGlow)">
    <text x="1920" y="1800" font-family="Impact, sans-serif" font-size="120" fill="#6633aa" text-anchor="middle" letter-spacing="15" opacity="0.6">JESSICA JONES</text>
  </g>

  <!-- Deep vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#000000" stroke-width="600" opacity="0.6" rx="1000"/>
</svg>
