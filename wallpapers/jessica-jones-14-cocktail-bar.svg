<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Late evening bar interior -->
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1020"/>
      <stop offset="50%" style="stop-color:#2a1828"/>
      <stop offset="100%" style="stop-color:#150a15"/>
    </linearGradient>
    <!-- Bar back light (warm amber) -->
    <linearGradient id="barBackLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ffaa40;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffaa40;stop-opacity:0"/>
    </linearGradient>
    <!-- Neon pink accent -->
    <filter id="neonPink">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Mirror/glass reflection -->
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2030;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1a1020;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Skin warm -->
    <linearGradient id="skinPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0b4"/>
      <stop offset="100%" style="stop-color:#e4bca0"/>
    </linearGradient>
    <!-- White dress with pink neon tint -->
    <linearGradient id="dressNeonWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f5"/>
      <stop offset="40%" style="stop-color:#f8f0ec"/>
      <stop offset="100%" style="stop-color:#f0e4e0"/>
    </linearGradient>
    <!-- Bottle glow -->
    <filter id="bottleGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#barBg)"/>

  <!-- Bar back wall (shelves with bottles, mirror) -->
  <rect x="0" y="0" width="3840" height="1000" fill="#1a1020"/>
  
  <!-- Large mirror behind bar -->
  <rect x="800" y="100" width="2240" height="700" fill="url(#mirrorGrad)" rx="10"/>
  <rect x="800" y="100" width="2240" height="700" fill="none" stroke="#4a3040" stroke-width="8" rx="10"/>
  
  <!-- Bottle shelves (in front of mirror) -->
  <rect x="900" y="400" width="2040" height="6" fill="#3a2530"/>
  <rect x="900" y="600" width="2040" height="6" fill="#3a2530"/>
  
  <!-- Bottles on shelves (backlit, various colors) -->
  <g opacity="0.7" filter="url(#bottleGlow)">
    <!-- Top shelf -->
    <rect x="950" y="350" width="20" height="45" fill="#4a2010" rx="3"/>
    <rect x="1000" y="340" width="18" height="55" fill="#1a4030" rx="3"/>
    <rect x="1050" y="345" width="22" height="50" fill="#6a3020" rx="3"/>
    <rect x="1100" y="335" width="16" height="60" fill="#2a2060" rx="3"/>
    <rect x="1150" y="350" width="20" height="45" fill="#4a1a10" rx="3"/>
    <rect x="1200" y="340" width="18" height="55" fill="#1a5040" rx="3"/>
    <rect x="1400" y="345" width="22" height="50" fill="#5a2818" rx="3"/>
    <rect x="1450" y="338" width="16" height="57" fill="#3a2060" rx="3"/>
    <rect x="1500" y="350" width="20" height="45" fill="#6a4020" rx="3"/>
    <rect x="1700" y="340" width="18" height="55" fill="#1a3040" rx="3"/>
    <rect x="1750" y="348" width="22" height="47" fill="#5a1a10" rx="3"/>
    <rect x="1800" y="335" width="16" height="60" fill="#2a4030" rx="3"/>
    <rect x="2000" y="345" width="20" height="50" fill="#4a2818" rx="3"/>
    <rect x="2050" y="340" width="18" height="55" fill="#6a3020" rx="3"/>
    <rect x="2100" y="350" width="22" height="45" fill="#1a2050" rx="3"/>
    <rect x="2300" y="338" width="16" height="57" fill="#5a3020" rx="3"/>
    <rect x="2350" y="345" width="20" height="50" fill="#2a5040" rx="3"/>
    <rect x="2400" y="340" width="18" height="55" fill="#4a1a10" rx="3"/>
    <rect x="2600" y="348" width="22" height="47" fill="#3a2060" rx="3"/>
    <rect x="2650" y="335" width="16" height="60" fill="#6a4020" rx="3"/>
    <rect x="2700" y="345" width="20" height="50" fill="#1a4030" rx="3"/>
    <!-- Bottom shelf -->
    <rect x="950" y="550" width="22" height="45" fill="#5a2818" rx="3"/>
    <rect x="1000" y="540" width="18" height="55" fill="#2a5040" rx="3"/>
    <rect x="1050" y="545" width="20" height="50" fill="#6a3020" rx="3"/>
    <rect x="1200" y="550" width="22" height="45" fill="#4a1a10" rx="3"/>
    <rect x="1250" y="538" width="16" height="57" fill="#1a3050" rx="3"/>
    <rect x="1500" y="545" width="20" height="50" fill="#5a2818" rx="3"/>
    <rect x="1550" y="540" width="18" height="55" fill="#3a4030" rx="3"/>
    <rect x="1800" y="548" width="22" height="47" fill="#4a2010" rx="3"/>
    <rect x="1850" y="540" width="16" height="55" fill="#6a3020" rx="3"/>
    <rect x="2100" y="545" width="20" height="50" fill="#2a2060" rx="3"/>
    <rect x="2150" y="538" width="18" height="57" fill="#5a3020" rx="3"/>
    <rect x="2400" y="548" width="22" height="47" fill="#1a5040" rx="3"/>
    <rect x="2450" y="540" width="16" height="55" fill="#4a1a10" rx="3"/>
    <rect x="2700" y="545" width="20" height="50" fill="#6a4020" rx="3"/>
  </g>

  <!-- Bar back lighting -->
  <rect x="800" y="100" width="2240" height="700" fill="url(#barBackLight)"/>

  <!-- Neon sign (Cyrillic "Коктейли" = Cocktails) -->
  <g filter="url(#neonPink)" transform="translate(1500, 180)">
    <text x="0" y="0" font-family="cursive, sans-serif" font-size="70" fill="#ff4488" opacity="0.8">Коктейли</text>
  </g>

  <!-- Bar counter surface -->
  <rect x="0" y="900" width="3840" height="80" fill="#3a2530"/>
  <rect x="0" y="900" width="3840" height="5" fill="#5a3545"/>
  <!-- Bar counter front -->
  <rect x="0" y="980" width="3840" height="400" fill="#2a1828"/>
  <!-- Paneling -->
  <g stroke="#3a2535" stroke-width="2" opacity="0.3">
    <rect x="100" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="450" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="800" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="1150" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="1500" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="1850" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="2200" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="2550" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="2900" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="3250" y="1020" width="300" height="320" fill="none" rx="5"/>
    <rect x="3600" y="1020" width="200" height="320" fill="none" rx="5"/>
  </g>

  <!-- Bar stools -->
  <g fill="#2a1520">
    <circle cx="1000" cy="1200" r="30"/>
    <rect x="997" y="1230" width="6" height="200"/>
    <circle cx="1600" cy="1200" r="30"/>
    <rect x="1597" y="1230" width="6" height="200"/>
    <circle cx="2800" cy="1200" r="30"/>
    <rect x="2797" y="1230" width="6" height="200"/>
    <circle cx="3400" cy="1200" r="30"/>
    <rect x="3397" y="1230" width="6" height="200"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="1400" width="3840" height="760" fill="#150a15"/>

  <!-- Items on bar -->
  <!-- Cocktail (hers - cosmopolitan pink) -->
  <g transform="translate(2100, 820)">
    <polygon points="-20,-30 0,40 20,-30" fill="#ff6688" opacity="0.3"/>
    <rect x="-2" y="40" width="4" height="30" fill="#c0b8b0"/>
    <ellipse cx="0" cy="72" rx="15" ry="4" fill="#c0b8b0"/>
    <!-- Lime garnish -->
    <circle cx="8" cy="-15" r="5" fill="#80c040" opacity="0.6"/>
  </g>

  <!-- Small plate of blini/zakuski -->
  <ellipse cx="2300" cy="880" rx="55" ry="18" fill="#f0e8e0" stroke="#d8d0c8" stroke-width="1"/>
  <g opacity="0.5">
    <ellipse cx="2280" cy="872" rx="12" ry="6" fill="#daa050"/>
    <ellipse cx="2310" cy="874" rx="10" ry="5" fill="#daa050"/>
    <circle cx="2295" cy="868" r="3" fill="#cc3030"/>
    <circle cx="2320" cy="870" r="2" fill="#cc3030"/>
  </g>

  <!-- Napkin -->
  <rect x="1950" y="860" width="80" height="50" fill="#f8f4f0" opacity="0.5" transform="rotate(-5,1990,885)"/>

  <!-- Jessica - seated at bar, turned toward friend beside her, laughing -->
  <!-- Casual, social, white dress catching the pink neon -->
  <g transform="translate(2100, 400)">
    <!-- Hair -->
    <path d="M-36,70 Q-46,120 -42,190 Q-40,250 -36,300" fill="#1a1014"/>
    <path d="M36,68 Q44,110 42,180 Q40,240 38,290" fill="#1a1014"/>
    
    <!-- Head (slightly tilted, laughing) -->
    <ellipse cx="0" cy="52" rx="33" ry="40" fill="url(#skinPink)" transform="rotate(-5,0,52)"/>
    
    <!-- Hair top -->
    <path d="M-33,42 Q-36,22 -28,8 Q-14,-5 0,-8 Q14,-5 28,8 Q36,22 33,42" fill="#1a1014"/>
    
    <!-- Eyes (crinkled with laughter) -->
    <path d="M-14,46 Q-10,43 -6,46" fill="none" stroke="#3a2820" stroke-width="2.5"/>
    <path d="M6,45 Q10,42 14,45" fill="none" stroke="#3a2820" stroke-width="2.5"/>
    <!-- Laugh crinkles -->
    <path d="M-16,44 Q-18,42 -16,40" fill="none" stroke="#d4a888" stroke-width="0.8" opacity="0.5"/>
    <path d="M16,43 Q18,41 16,39" fill="none" stroke="#d4a888" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Nose -->
    <path d="M0,48 L-1,60 L2,60" fill="none" stroke="#d4a888" stroke-width="1"/>
    
    <!-- Open smile (laughing) -->
    <path d="M-10,68 Q0,80 10,68" fill="#a04040" opacity="0.5"/>
    <path d="M-8,68 Q0,64 8,68" fill="#d48070" opacity="0.6"/>
    <!-- Teeth hint -->
    <path d="M-6,68 L6,68" stroke="#f8f0e8" stroke-width="2" opacity="0.4"/>
    
    <!-- Neck -->
    <path d="M-10,84 L-10,110 L10,110 L10,84" fill="url(#skinPink)"/>
    
    <!-- White dress (catching pink neon light) -->
    <path d="M-48,110 Q-52,140 -55,200 L-52,400 Q-28,420 0,422 Q28,420 52,400 L55,200 Q52,140 48,110 Q24,103 0,105 Q-24,103 -48,110 Z" fill="url(#dressNeonWhite)"/>
    <!-- Pink neon reflection on dress -->
    <path d="M-48,110 Q-52,140 -55,200 L-52,400 Q-28,420 0,422 Q28,420 52,400 L55,200 Q52,140 48,110 Q24,103 0,105 Q-24,103 -48,110 Z" fill="#ff4488" opacity="0.03"/>
    <!-- Neckline -->
    <path d="M-35,110 Q0,118 35,110" fill="none" stroke="#e8dcd4" stroke-width="1.5"/>
    <!-- Fabric folds -->
    <path d="M-15,160 Q-12,250 -15,380" fill="none" stroke="#e8dcd4" stroke-width="1" opacity="0.4"/>
    <path d="M18,170 Q20,260 17,390" fill="none" stroke="#e8dcd4" stroke-width="1" opacity="0.4"/>
    
    <!-- Arms (bare) -->
    <!-- Left arm on bar counter -->
    <path d="M-48,120 Q-65,180 -70,250 Q-72,320 -65,380" fill="url(#skinPink)"/>
    <!-- Right arm gesturing (social conversation) -->
    <path d="M48,120 Q65,170 72,230 Q75,270 70,300" fill="url(#skinPink)"/>
    <!-- Hand open (gesturing) -->
    <g transform="translate(70,300)">
      <ellipse cx="0" cy="0" rx="10" ry="13" fill="url(#skinPink)"/>
    </g>
    
    <!-- Simple pendant necklace -->
    <path d="M-12,98 Q0,108 12,98" fill="none" stroke="#c8a050" stroke-width="0.8"/>
    <circle cx="0" cy="108" r="3" fill="#c8a050" opacity="0.7"/>
  </g>

  <!-- Friend beside her (female, casual, warm silhouette) -->
  <g transform="translate(2500, 450)" opacity="0.5">
    <ellipse cx="0" cy="50" rx="28" ry="35" fill="#2a1a18"/>
    <path d="M-28,45 Q-32,70 -28,85" fill="#2a1a18"/>
    <path d="M28,45 Q32,65 30,80" fill="#2a1a18"/>
    <path d="M-35,85 L-30,350 L30,350 L35,85 Q18,78 0,80 Q-18,78 -35,85 Z" fill="#301828"/>
    <!-- Holding drink -->
    <rect x="40" y="250" width="4" height="40" fill="#c0b8b0" opacity="0.5"/>
  </g>

  <!-- Neon pink ambient on everything -->
  <rect width="3840" height="2160" fill="#ff4488" opacity="0.015"/>

  <!-- Warm/cool vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#050008" stroke-width="350" opacity="0.45" rx="800"/>
</svg>
