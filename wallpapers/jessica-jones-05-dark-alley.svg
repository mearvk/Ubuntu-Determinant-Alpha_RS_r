<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Dark alley gradient -->
    <linearGradient id="alleyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050008"/>
      <stop offset="50%" style="stop-color:#0a0515"/>
      <stop offset="100%" style="stop-color:#080412"/>
    </linearGradient>
    <!-- Purple neon reflection -->
    <linearGradient id="neonReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6633aa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6633aa;stop-opacity:0"/>
    </linearGradient>
    <!-- Puddle reflection -->
    <linearGradient id="puddleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0a30;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#4422aa;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#1a0a30;stop-opacity:0.3"/>
    </linearGradient>
    <!-- Neon sign glow -->
    <filter id="neonPurple">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wet surface -->
    <filter id="wetSurface">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <!-- Fire escape shadow -->
    <filter id="feShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#alleyGrad)"/>

  <!-- Left building wall (perspective) -->
  <path d="M0,0 L1200,200 L1200,2160 L0,2160 Z" fill="#0a0615"/>
  <!-- Left wall brick texture -->
  <g stroke="#12091e" stroke-width="1" opacity="0.4">
    <line x1="100" y1="300" x2="1100" y2="400"/>
    <line x1="100" y1="450" x2="1100" y2="540"/>
    <line x1="100" y1="600" x2="1100" y2="680"/>
    <line x1="100" y1="750" x2="1100" y2="820"/>
    <line x1="100" y1="900" x2="1100" y2="960"/>
    <line x1="100" y1="1050" x2="1100" y2="1100"/>
    <line x1="100" y1="1200" x2="1100" y2="1240"/>
    <line x1="100" y1="1350" x2="1100" y2="1380"/>
    <line x1="100" y1="1500" x2="1100" y2="1520"/>
    <line x1="100" y1="1650" x2="1100" y2="1660"/>
    <line x1="100" y1="1800" x2="1100" y2="1800"/>
  </g>

  <!-- Right building wall (perspective) -->
  <path d="M3840,0 L2640,200 L2640,2160 L3840,2160 Z" fill="#0c0718"/>
  <!-- Right wall brick texture -->
  <g stroke="#140a20" stroke-width="1" opacity="0.4">
    <line x1="2740" y1="400" x2="3740" y2="300"/>
    <line x1="2740" y1="540" x2="3740" y2="450"/>
    <line x1="2740" y1="680" x2="3740" y2="600"/>
    <line x1="2740" y1="820" x2="3740" y2="750"/>
    <line x1="2740" y1="960" x2="3740" y2="900"/>
    <line x1="2740" y1="1100" x2="3740" y2="1050"/>
    <line x1="2740" y1="1240" x2="3740" y2="1200"/>
    <line x1="2740" y1="1380" x2="3740" y2="1350"/>
    <line x1="2740" y1="1520" x2="3740" y2="1500"/>
    <line x1="2740" y1="1660" x2="3740" y2="1650"/>
    <line x1="2740" y1="1800" x2="3740" y2="1800"/>
  </g>

  <!-- Alley floor (perspective lines) -->
  <path d="M1200,2160 L1920,900 L2640,2160 Z" fill="#060310" opacity="0.5"/>
  <g stroke="#0f0820" stroke-width="1" opacity="0.3">
    <line x1="1200" y1="2160" x2="1920" y2="900"/>
    <line x1="2640" y1="2160" x2="1920" y2="900"/>
    <line x1="1400" y1="2160" x2="1920" y2="900"/>
    <line x1="1600" y1="2160" x2="1920" y2="900"/>
    <line x1="2000" y1="2160" x2="1920" y2="900"/>
    <line x1="2200" y1="2160" x2="1920" y2="900"/>
    <line x1="2440" y1="2160" x2="1920" y2="900"/>
  </g>

  <!-- Fire escape (left wall) -->
  <g stroke="#1a1025" stroke-width="4" fill="none" filter="url(#feShadow)">
    <!-- Platform 1 -->
    <rect x="200" y="500" width="300" height="8" fill="#1a1025"/>
    <line x1="200" y1="508" x2="200" y2="700"/>
    <line x1="500" y1="508" x2="500" y2="700"/>
    <!-- Railing -->
    <line x1="200" y1="470" x2="500" y2="470"/>
    <line x1="200" y1="470" x2="200" y2="500"/>
    <line x1="500" y1="470" x2="500" y2="500"/>
    <line x1="300" y1="470" x2="300" y2="500"/>
    <line x1="400" y1="470" x2="400" y2="500"/>
    <!-- Platform 2 -->
    <rect x="250" y="800" width="300" height="8" fill="#1a1025"/>
    <line x1="250" y1="808" x2="250" y2="1000"/>
    <line x1="550" y1="808" x2="550" y2="1000"/>
    <line x1="250" y1="770" x2="550" y2="770"/>
    <line x1="250" y1="770" x2="250" y2="800"/>
    <line x1="550" y1="770" x2="550" y2="800"/>
    <line x1="350" y1="770" x2="350" y2="800"/>
    <line x1="450" y1="770" x2="450" y2="800"/>
    <!-- Platform 3 -->
    <rect x="300" y="1100" width="300" height="8" fill="#1a1025"/>
    <line x1="300" y1="1108" x2="300" y2="1300"/>
    <line x1="600" y1="1108" x2="600" y2="1300"/>
    <line x1="300" y1="1070" x2="600" y2="1070"/>
    <line x1="300" y1="1070" x2="300" y2="1100"/>
    <line x1="600" y1="1070" x2="600" y2="1100"/>
    <line x1="400" y1="1070" x2="400" y2="1100"/>
    <line x1="500" y1="1070" x2="500" y2="1100"/>
    <!-- Diagonal stairs between platforms -->
    <line x1="500" y1="508" x2="250" y2="800" stroke-width="3"/>
    <line x1="550" y1="808" x2="300" y2="1100" stroke-width="3"/>
  </g>

  <!-- Neon sign on right wall "BAR" -->
  <g filter="url(#neonPurple)" transform="translate(2800, 600)">
    <text x="0" y="0" font-family="sans-serif" font-size="80" fill="#cc44ff" font-weight="bold">BAR</text>
  </g>
  <!-- Neon glow cast on wall -->
  <rect x="2640" y="500" width="400" height="300" fill="#6633aa" opacity="0.04"/>

  <!-- Another neon (left wall, deeper) "HOTEL" -->
  <g filter="url(#neonPurple)" transform="translate(700, 400)">
    <text x="0" y="0" font-family="sans-serif" font-size="50" fill="#ff3366" font-weight="bold" opacity="0.6">HOTEL</text>
  </g>

  <!-- Puddle on alley floor -->
  <ellipse cx="1920" cy="1700" rx="400" ry="80" fill="url(#puddleGrad)"/>
  <!-- Puddle reflections -->
  <g opacity="0.15" filter="url(#wetSurface)">
    <rect x="1750" y="1680" width="6" height="30" fill="#cc44ff"/>
    <rect x="1900" y="1690" width="4" height="20" fill="#ff3366"/>
    <rect x="2050" y="1685" width="5" height="25" fill="#cc44ff"/>
  </g>

  <!-- Dumpster -->
  <g transform="translate(2400, 1500)">
    <rect x="0" y="0" width="180" height="120" fill="#0d0818" rx="5"/>
    <rect x="-5" y="-5" width="190" height="10" fill="#1a1025" rx="3"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="#151020" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="120" stroke="#151020" stroke-width="2"/>
  </g>

  <!-- Steam rising from grate -->
  <g fill="#2d1b4e" opacity="0.15">
    <path d="M1800,1900 Q1790,1850 1810,1800 Q1820,1750 1800,1700"/>
    <path d="M1850,1900 Q1860,1840 1840,1780 Q1830,1720 1850,1680"/>
    <path d="M1900,1900 Q1890,1860 1910,1820 Q1920,1780 1900,1740"/>
  </g>

  <!-- Jessica Jones - walking toward viewer through the alley -->
  <!-- Center composition, emerging from shadow into slight neon light -->
  <g transform="translate(1920, 1000)">
    <!-- Shadow beneath -->
    <ellipse cx="0" cy="700" rx="70" ry="20" fill="#000000" opacity="0.4"/>
    <!-- Boots -->
    <rect x="-22" y="620" width="18" height="55" fill="#0a0a0f"/>
    <rect x="8" y="625" width="18" height="50" fill="#0a0a0f"/>
    <!-- Legs - walking stride -->
    <path d="M-20,480 L-22,620 L-4,620 L0,480 Z" fill="#12101e"/>
    <path d="M4,480 L8,625 L26,625 L22,480 Z" fill="#12101e"/>
    <!-- Torso -->
    <path d="M-40,250 L-30,480 L34,480 L44,250 Z" fill="#14111e"/>
    <!-- Jacket open, revealing dark shirt underneath -->
    <path d="M-15,260 L-10,450 L15,450 L20,260 Z" fill="#0a0810"/>
    <!-- Jacket lapels -->
    <path d="M-40,250 L-15,260 L-12,350 L-35,340" fill="#16131f"/>
    <path d="M44,250 L20,260 L17,350 L39,340" fill="#16131f"/>
    <!-- Collar up -->
    <path d="M-35,240 L-20,230 L0,240 L20,230 L35,240" fill="#1a1625" stroke="#201a2a" stroke-width="1"/>
    <!-- Arms -->
    <path d="M-40,270 L-55,380 L-50,460 L-35,450" fill="#14111e"/>
    <path d="M44,270 L60,370 L55,450 L40,440" fill="#14111e"/>
    <!-- Head -->
    <ellipse cx="2" cy="205" rx="26" ry="32" fill="#1a1520"/>
    <!-- Face (minimal features - noir shadow) -->
    <path d="M-12,195 L-8,190 L-4,195" fill="none" stroke="#2a2030" stroke-width="1.5"/>
    <path d="M8,195 L12,190 L16,195" fill="none" stroke="#2a2030" stroke-width="1.5"/>
    <!-- Hair -->
    <path d="M-26,190 Q-30,170 -22,155 Q-10,142 5,140 Q20,142 28,155 Q34,170 30,190" fill="#0d0d12"/>
    <path d="M-26,195 Q-32,215 -28,240" fill="none" stroke="#0d0d12" stroke-width="5"/>
    <path d="M30,195 Q36,210 32,235" fill="none" stroke="#0d0d12" stroke-width="5"/>
    <!-- Purple neon light catching the jacket edge -->
    <line x1="-40" y1="260" x2="-38" y2="400" stroke="#6633aa" stroke-width="1.5" opacity="0.3"/>
    <line x1="44" y1="260" x2="42" y2="400" stroke="#6633aa" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Atmospheric rain -->
  <g stroke="#5533aa" stroke-width="1" opacity="0.2">
    <line x1="1400" y1="300" x2="1395" y2="380"/>
    <line x1="1600" y1="500" x2="1595" y2="580"/>
    <line x1="1800" y1="200" x2="1795" y2="280"/>
    <line x1="2000" y1="400" x2="1995" y2="480"/>
    <line x1="2200" y1="300" x2="2195" y2="380"/>
    <line x1="2400" y1="600" x2="2395" y2="680"/>
    <line x1="1500" y1="700" x2="1495" y2="780"/>
    <line x1="1700" y1="800" x2="1695" y2="880"/>
    <line x1="1900" y1="650" x2="1895" y2="730"/>
    <line x1="2100" y1="750" x2="2095" y2="830"/>
    <line x1="2300" y1="850" x2="2295" y2="930"/>
    <line x1="1350" y1="1000" x2="1345" y2="1080"/>
    <line x1="1550" y1="1100" x2="1545" y2="1180"/>
    <line x1="1750" y1="950" x2="1745" y2="1030"/>
    <line x1="2050" y1="1050" x2="2045" y2="1130"/>
    <line x1="2250" y1="1150" x2="2245" y2="1230"/>
    <line x1="2450" y1="1000" x2="2445" y2="1080"/>
  </g>

  <!-- Deep perspective vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#000000" stroke-width="500" opacity="0.55" rx="900"/>
</svg>
