<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Warm restaurant ambient -->
    <linearGradient id="ambientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1810"/>
      <stop offset="40%" style="stop-color:#3d2218"/>
      <stop offset="100%" style="stop-color:#1a0e08"/>
    </linearGradient>
    <!-- Candle glow -->
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffcc66;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#ff9933;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0"/>
    </radialGradient>
    <!-- Warm overhead light -->
    <radialGradient id="overheadWarm" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffddaa;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    <!-- Wine glass -->
    <linearGradient id="wineRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b1a2a;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#5a0f1a;stop-opacity:0.9"/>
    </linearGradient>
    <!-- White dress fabric -->
    <linearGradient id="dressWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="50%" style="stop-color:#ede5d8"/>
      <stop offset="100%" style="stop-color:#e0d6c8"/>
    </linearGradient>
    <!-- Soft candle filter -->
    <filter id="candleSoft">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Warm skin tone -->
    <linearGradient id="skinWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c4a0"/>
      <stop offset="100%" style="stop-color:#d4a882"/>
    </linearGradient>
    <!-- Bokeh circles -->
    <filter id="bokeh">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Restaurant background -->
  <rect width="3840" height="2160" fill="url(#ambientGrad)"/>
  
  <!-- Warm overhead ambience -->
  <rect width="3840" height="2160" fill="url(#overheadWarm)"/>

  <!-- Back wall - dark wood paneling -->
  <rect x="0" y="0" width="3840" height="1200" fill="#2a1a12" opacity="0.8"/>
  <!-- Wood panel lines -->
  <g stroke="#3a2518" stroke-width="2" opacity="0.4">
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="1200" y1="0" x2="1200" y2="1200"/>
    <line x1="1800" y1="0" x2="1800" y2="1200"/>
    <line x1="2400" y1="0" x2="2400" y2="1200"/>
    <line x1="3000" y1="0" x2="3000" y2="1200"/>
    <line x1="3600" y1="0" x2="3600" y2="1200"/>
  </g>

  <!-- Russian restaurant art on wall (abstract gold frame) -->
  <rect x="500" y="200" width="400" height="500" fill="#1a0e08" stroke="#c8a050" stroke-width="6"/>
  <rect x="520" y="220" width="360" height="460" fill="#2a1a12"/>
  <!-- Abstract art suggestion inside frame -->
  <circle cx="700" cy="400" r="80" fill="#8b3a1a" opacity="0.4"/>
  <circle cx="680" cy="380" r="50" fill="#c87030" opacity="0.3"/>

  <rect x="2900" y="250" width="500" height="400" fill="#1a0e08" stroke="#c8a050" stroke-width="6"/>
  <rect x="2920" y="270" width="460" height="360" fill="#2a1a12"/>
  <path d="M3000,450 Q3100,350 3200,400 Q3300,450 3350,380" fill="none" stroke="#c87030" stroke-width="3" opacity="0.4"/>

  <!-- Distant table (background, blurred) -->
  <g opacity="0.3" filter="url(#bokeh)">
    <ellipse cx="600" cy="1100" rx="200" ry="50" fill="#3a2518"/>
    <circle cx="600" cy="1060" r="15" fill="#ffcc66" opacity="0.6"/>
  </g>
  <g opacity="0.3" filter="url(#bokeh)">
    <ellipse cx="3200" cy="1050" rx="180" ry="45" fill="#3a2518"/>
    <circle cx="3200" cy="1010" r="12" fill="#ffcc66" opacity="0.5"/>
  </g>

  <!-- Bokeh lights (background atmosphere) -->
  <g filter="url(#bokeh)" opacity="0.25">
    <circle cx="200" cy="300" r="30" fill="#ffdd88"/>
    <circle cx="800" cy="150" r="25" fill="#ffcc66"/>
    <circle cx="1400" cy="250" r="20" fill="#ffbb44"/>
    <circle cx="2200" cy="180" r="28" fill="#ffdd88"/>
    <circle cx="3000" cy="120" r="22" fill="#ffcc66"/>
    <circle cx="3500" cy="280" r="26" fill="#ffbb44"/>
    <circle cx="400" cy="500" r="18" fill="#ffcc66"/>
    <circle cx="3400" cy="550" r="20" fill="#ffdd88"/>
  </g>

  <!-- Main table (center) -->
  <ellipse cx="1920" cy="1500" rx="700" ry="180" fill="#4a2e1e"/>
  <!-- Tablecloth white/cream linen -->
  <ellipse cx="1920" cy="1490" rx="680" ry="170" fill="#f5f0e8" opacity="0.15"/>
  <!-- Table edge shadow -->
  <ellipse cx="1920" cy="1510" rx="700" ry="180" fill="none" stroke="#2a1a10" stroke-width="3"/>

  <!-- Place settings -->
  <!-- Plate left -->
  <ellipse cx="1550" cy="1480" rx="100" ry="35" fill="#f8f4ee" stroke="#d4c8b0" stroke-width="2"/>
  <ellipse cx="1550" cy="1478" rx="75" ry="26" fill="none" stroke="#d4c8b0" stroke-width="1"/>
  <!-- Plate right -->
  <ellipse cx="2290" cy="1480" rx="100" ry="35" fill="#f8f4ee" stroke="#d4c8b0" stroke-width="2"/>
  <ellipse cx="2290" cy="1478" rx="75" ry="26" fill="none" stroke="#d4c8b0" stroke-width="1"/>

  <!-- Silverware -->
  <rect x="1420" y="1450" width="3" height="70" fill="#c0b8a8" rx="1"/>
  <rect x="1430" y="1450" width="3" height="70" fill="#c0b8a8" rx="1"/>
  <rect x="1670" y="1450" width="3" height="70" fill="#c0b8a8" rx="1"/>
  <rect x="1680" y="1450" width="3" height="70" fill="#c0b8a8" rx="1"/>

  <!-- Candle centerpiece -->
  <g transform="translate(1920, 1350)" filter="url(#candleSoft)">
    <rect x="-8" y="0" width="16" height="80" fill="#f5f0e0"/>
    <ellipse cx="0" cy="0" rx="12" ry="20" fill="#ffcc33" opacity="0.9"/>
    <ellipse cx="0" cy="-5" rx="6" ry="12" fill="#ffff88" opacity="0.7"/>
  </g>
  <!-- Candle glow on table -->
  <ellipse cx="1920" cy="1450" rx="250" ry="100" fill="url(#candleGlow)"/>

  <!-- Wine bottle -->
  <g transform="translate(2050, 1280)">
    <rect x="0" y="50" width="30" height="100" fill="#2a0f0a" rx="3"/>
    <rect x="8" y="20" width="14" height="35" fill="#1a0a05"/>
    <rect x="10" y="10" width="10" height="12" fill="#1a0a05"/>
    <!-- Label -->
    <rect x="4" y="70" width="22" height="40" fill="#f5f0e0" opacity="0.6"/>
    <!-- Cyrillic text on label -->
    <text x="6" y="90" font-family="serif" font-size="8" fill="#2a1a10" opacity="0.7">Вино</text>
  </g>

  <!-- Wine glass (her side) -->
  <g transform="translate(1650, 1380)">
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="#ffffff" opacity="0.15"/>
    <path d="M-18,0 L-12,50 L12,50 L18,0 Z" fill="url(#wineRed)" opacity="0.6"/>
    <rect x="-3" y="50" width="6" height="40" fill="#d4c8b0"/>
    <ellipse cx="0" cy="92" rx="18" ry="5" fill="#d4c8b0"/>
  </g>

  <!-- Wine glass (other side) -->
  <g transform="translate(2180, 1380)">
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="#ffffff" opacity="0.15"/>
    <path d="M-18,0 L-12,50 L12,50 L18,0 Z" fill="url(#wineRed)" opacity="0.5"/>
    <rect x="-3" y="50" width="6" height="40" fill="#d4c8b0"/>
    <ellipse cx="0" cy="92" rx="18" ry="5" fill="#d4c8b0"/>
  </g>

  <!-- Small bread basket -->
  <g transform="translate(1800, 1400)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#8b6030"/>
    <ellipse cx="-10" cy="-8" rx="15" ry="10" fill="#d4a050"/>
    <ellipse cx="10" cy="-5" rx="14" ry="9" fill="#c89040"/>
    <ellipse cx="0" cy="-12" rx="12" ry="8" fill="#daa860"/>
  </g>

  <!-- Jessica Jones / Krysten Ritter - seated at table, white dress, casual elegance -->
  <!-- She's relaxed, one hand near wine glass, slight smile implied, hair down -->
  <g transform="translate(1600, 800)">
    <!-- Hair (dark, flowing, past shoulders) -->
    <path d="M-35,80 Q-45,120 -40,180 Q-38,220 -35,260 L-28,260 Q-32,200 -30,140 Q-28,100 -20,80" fill="#1a1014"/>
    <path d="M35,80 Q45,115 42,170 Q40,220 38,260 L30,260 Q34,200 32,140 Q30,100 22,80" fill="#1a1014"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="60" rx="32" ry="40" fill="url(#skinWarm)"/>
    
    <!-- Hair top/bangs -->
    <path d="M-32,50 Q-35,30 -28,15 Q-15,0 0,-5 Q15,0 28,15 Q35,30 32,50" fill="#1a1014"/>
    <path d="M-28,40 Q-20,30 -10,35" fill="none" stroke="#1a1014" stroke-width="3"/>
    
    <!-- Eyes (subtle, warm) -->
    <ellipse cx="-10" cy="55" rx="5" ry="3.5" fill="#2a2020"/>
    <ellipse cx="10" cy="55" rx="5" ry="3.5" fill="#2a2020"/>
    <circle cx="-10" cy="54" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="10" cy="54" r="1.5" fill="#ffffff" opacity="0.6"/>
    <!-- Eyebrows -->
    <path d="M-16,47 Q-10,44 -5,46" fill="none" stroke="#2a1a14" stroke-width="1.5"/>
    <path d="M5,46 Q10,44 16,47" fill="none" stroke="#2a1a14" stroke-width="1.5"/>
    
    <!-- Nose -->
    <path d="M0,55 L-2,68 L2,68" fill="none" stroke="#c8a080" stroke-width="1"/>
    
    <!-- Lips (slight smile) -->
    <path d="M-8,76 Q0,82 8,76" fill="#c87060" opacity="0.7"/>
    <path d="M-7,76 Q0,74 7,76" fill="#d48070" opacity="0.5"/>
    
    <!-- Neck -->
    <rect x="-8" y="90" width="16" height="30" fill="url(#skinWarm)"/>
    
    <!-- White dress - casual, slightly off-shoulder, elegant -->
    <path d="M-45,120 Q-50,125 -55,180 L-50,380 Q-30,400 0,405 Q30,400 50,380 L55,180 Q50,125 45,120 Q20,110 0,112 Q-20,110 -45,120 Z" fill="url(#dressWhite)"/>
    <!-- Dress neckline (slightly wide/casual) -->
    <path d="M-40,120 Q-20,130 0,132 Q20,130 40,120" fill="none" stroke="#d4c8b8" stroke-width="1.5"/>
    <!-- Dress fabric folds -->
    <path d="M-20,180 Q-15,250 -18,350" fill="none" stroke="#d4c8b8" stroke-width="1" opacity="0.5"/>
    <path d="M15,200 Q18,270 15,360" fill="none" stroke="#d4c8b8" stroke-width="1" opacity="0.5"/>
    
    <!-- Left arm (reaching toward wine glass) -->
    <path d="M-45,140 Q-65,200 -70,280 Q-72,320 -60,350" fill="url(#skinWarm)"/>
    <!-- Right arm (resting on table edge) -->
    <path d="M45,140 Q60,200 65,280 Q68,330 60,370" fill="url(#skinWarm)"/>
    
    <!-- Subtle jewelry - small earring -->
    <circle cx="-22" cy="85" r="3" fill="#c8a050" opacity="0.7"/>
    <circle cx="22" cy="85" r="3" fill="#c8a050" opacity="0.7"/>
    
    <!-- Delicate necklace -->
    <path d="M-15,105 Q0,115 15,105" fill="none" stroke="#c8a050" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="115" r="2.5" fill="#c8a050" opacity="0.6"/>
  </g>

  <!-- Companion silhouette across table (implied, partial, soft focus) -->
  <g transform="translate(2300, 850)" opacity="0.4" filter="url(#bokeh)">
    <ellipse cx="0" cy="60" rx="28" ry="36" fill="#2a1a12"/>
    <path d="M-35,100 L-30,300 L30,300 L35,100 Z" fill="#1a1210"/>
    <path d="M-28,80 Q0,60 28,80" fill="#1a1210"/>
  </g>

  <!-- Warm candlelight reflection on her skin/dress -->
  <ellipse cx="1600" cy="1000" rx="150" ry="200" fill="#ffcc66" opacity="0.04"/>

  <!-- Floor (dark hardwood) -->
  <rect x="0" y="1700" width="3840" height="460" fill="#1a0e08"/>

  <!-- Russian restaurant text/signage in background -->
  <text x="1750" y="150" font-family="serif" font-size="48" fill="#c8a050" opacity="0.25" letter-spacing="6">РЕСТОРАН</text>

  <!-- Subtle warm vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#0a0500" stroke-width="400" opacity="0.45" rx="900"/>
</svg>
