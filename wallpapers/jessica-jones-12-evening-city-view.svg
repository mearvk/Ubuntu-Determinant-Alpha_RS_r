<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Evening Moscow sky gradient -->
    <linearGradient id="eveningSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="30%" style="stop-color:#2a1550"/>
      <stop offset="50%" style="stop-color:#4a2060"/>
      <stop offset="70%" style="stop-color:#cc6040"/>
      <stop offset="85%" style="stop-color:#ffaa50"/>
      <stop offset="100%" style="stop-color:#ffd080"/>
    </linearGradient>
    <!-- Window warm interior -->
    <radialGradient id="interiorWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffddaa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffaa66;stop-opacity:0"/>
    </radialGradient>
    <!-- Skin tone -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0b0"/>
      <stop offset="100%" style="stop-color:#e0b898"/>
    </linearGradient>
    <!-- White dress -->
    <linearGradient id="whiteDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="30%" style="stop-color:#f8f4f0"/>
      <stop offset="100%" style="stop-color:#ede5dc"/>
    </linearGradient>
    <!-- Warm glow -->
    <filter id="warmGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft focus background -->
    <filter id="bgSoft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Sky (visible through large window) -->
  <rect width="3840" height="2160" fill="#2a1810"/>

  <!-- Large restaurant window showing evening city -->
  <rect x="400" y="100" width="3040" height="1400" fill="url(#eveningSky)"/>
  <!-- Window frame -->
  <rect x="400" y="100" width="3040" height="1400" fill="none" stroke="#3a2518" stroke-width="20"/>
  <!-- Window dividers -->
  <line x1="1420" y1="100" x2="1420" y2="1500" stroke="#3a2518" stroke-width="12"/>
  <line x1="2420" y1="100" x2="2420" y2="1500" stroke="#3a2518" stroke-width="12"/>
  <line x1="400" y1="800" x2="3440" y2="800" stroke="#3a2518" stroke-width="10"/>

  <!-- City silhouette through window (Russian cityscape — domes, spires) -->
  <g fill="#1a0a20" opacity="0.6" filter="url(#bgSoft)">
    <!-- Regular buildings -->
    <rect x="500" y="900" width="100" height="600"/>
    <rect x="620" y="850" width="80" height="650"/>
    <rect x="720" y="950" width="120" height="550"/>
    <rect x="860" y="800" width="90" height="700"/>
    <!-- Orthodox dome -->
    <path d="M1050,750 Q1080,680 1100,700 Q1120,680 1150,750 L1150,1000 L1050,1000 Z"/>
    <circle cx="1100" cy="680" r="8"/>
    <!-- More buildings -->
    <rect x="1180" y="850" width="100" height="650"/>
    <rect x="1300" y="900" width="80" height="600"/>
    <!-- Tall spire -->
    <rect x="1500" y="600" width="40" height="900"/>
    <polygon points="1500,600 1520,500 1540,600"/>
    <!-- More skyline -->
    <rect x="1600" y="850" width="120" height="650"/>
    <rect x="1750" y="800" width="90" height="700"/>
    <!-- Another dome -->
    <path d="M1950,720 Q1980,650 2000,670 Q2020,650 2050,720 L2050,1000 L1950,1000 Z"/>
    <circle cx="2000" cy="650" r="7"/>
    <rect x="2080" y="900" width="100" height="600"/>
    <rect x="2200" y="850" width="80" height="650"/>
    <rect x="2300" y="920" width="110" height="580"/>
    <!-- Another spire -->
    <rect x="2500" y="650" width="35" height="850"/>
    <polygon points="2500,650 2518,560 2535,650"/>
    <rect x="2600" y="880" width="100" height="620"/>
    <rect x="2720" y="800" width="90" height="700"/>
    <rect x="2830" y="900" width="120" height="600"/>
    <rect x="2970" y="850" width="80" height="650"/>
    <rect x="3070" y="920" width="100" height="580"/>
    <rect x="3190" y="870" width="90" height="630"/>
    <rect x="3300" y="950" width="80" height="550"/>
  </g>

  <!-- City lights in buildings -->
  <g fill="#ffdd88" opacity="0.4" filter="url(#bgSoft)">
    <rect x="530" y="950" width="8" height="8"/>
    <rect x="550" y="1000" width="8" height="8"/>
    <rect x="650" y="900" width="8" height="8"/>
    <rect x="750" y="980" width="8" height="8"/>
    <rect x="890" y="850" width="8" height="8"/>
    <rect x="1210" y="900" width="8" height="8"/>
    <rect x="1630" y="880" width="8" height="8"/>
    <rect x="1780" y="850" width="8" height="8"/>
    <rect x="2110" y="950" width="8" height="8"/>
    <rect x="2230" y="900" width="8" height="8"/>
    <rect x="2630" y="920" width="8" height="8"/>
    <rect x="2750" y="850" width="8" height="8"/>
    <rect x="2860" y="950" width="8" height="8"/>
    <rect x="3100" y="960" width="8" height="8"/>
  </g>

  <!-- Interior wall (below window) -->
  <rect x="0" y="1500" width="3840" height="660" fill="#2a1810"/>
  <!-- Wainscoting -->
  <rect x="0" y="1500" width="3840" height="20" fill="#4a3020"/>

  <!-- Floor reflection -->
  <rect x="0" y="1900" width="3840" height="260" fill="#1a0e08"/>

  <!-- She's seated on window-side banquette, casual, turned slightly, city behind her -->
  <!-- Positioned right of center so the city panorama fills left -->
  <g transform="translate(2600, 750)">
    <!-- Hair (dark, long, natural) -->
    <path d="M-38,70 Q-50,120 -45,200 Q-42,280 -38,340" fill="#1a1014" stroke="none"/>
    <path d="M38,70 Q48,110 45,190 Q43,260 40,320" fill="#1a1014" stroke="none"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="55" rx="34" ry="42" fill="url(#skin)"/>
    
    <!-- Hair crown -->
    <path d="M-34,45 Q-38,25 -30,10 Q-15,-5 0,-8 Q15,-5 30,10 Q38,25 34,45" fill="#1a1014"/>
    <!-- Loose strand -->
    <path d="M-30,50 Q-35,60 -32,75" fill="none" stroke="#1a1014" stroke-width="2.5"/>
    
    <!-- Eyes - relaxed, happy -->
    <path d="M-14,50 Q-10,47 -6,50" fill="none" stroke="#2a1a14" stroke-width="2"/>
    <path d="M6,50 Q10,47 14,50" fill="none" stroke="#2a1a14" stroke-width="2"/>
    <ellipse cx="-10" cy="52" rx="4" ry="3" fill="#3a2a20"/>
    <ellipse cx="10" cy="52" rx="4" ry="3" fill="#3a2a20"/>
    <circle cx="-10" cy="51" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="10" cy="51" r="1.2" fill="#ffffff" opacity="0.5"/>
    
    <!-- Nose -->
    <path d="M0,52 L-1,66 L1,66" fill="none" stroke="#d4a080" stroke-width="1"/>
    
    <!-- Smile (genuine, casual) -->
    <path d="M-10,74 Q0,82 10,74" fill="#c87060" opacity="0.6"/>
    <path d="M-9,74 Q0,72 9,74" fill="#d88878" opacity="0.4"/>
    <!-- Slight dimple suggestion -->
    <path d="M-12,76 Q-14,78 -12,80" fill="none" stroke="#d4a080" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Neck -->
    <path d="M-10,90 L-10,120 L10,120 L10,90" fill="url(#skin)"/>
    
    <!-- White dress — casual summer/evening style, thin straps -->
    <path d="M-50,120 Q-55,150 -58,220 L-55,450 Q-30,470 0,472 Q30,470 55,450 L58,220 Q55,150 50,120 Q25,112 0,114 Q-25,112 -50,120 Z" fill="url(#whiteDress)"/>
    <!-- Thin straps -->
    <line x1="-20" y1="92" x2="-35" y2="120" stroke="#e8e0d8" stroke-width="4"/>
    <line x1="20" y1="92" x2="35" y2="120" stroke="#e8e0d8" stroke-width="4"/>
    <!-- Dress fabric drape -->
    <path d="M-25,180 Q-20,280 -22,400" fill="none" stroke="#d8d0c4" stroke-width="1" opacity="0.6"/>
    <path d="M20,200 Q22,300 18,420" fill="none" stroke="#d8d0c4" stroke-width="1" opacity="0.6"/>
    <!-- Slight wrap/fold at waist -->
    <path d="M-50,220 Q0,240 50,220" fill="none" stroke="#d8d0c4" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Arms (bare, relaxed) -->
    <!-- Left arm resting on banquette back -->
    <path d="M-50,130 Q-70,170 -80,220 Q-85,260 -75,290" fill="url(#skin)"/>
    <!-- Right arm forward (holding glass or gesturing) -->
    <path d="M50,130 Q65,180 70,240 Q72,280 65,310" fill="url(#skin)"/>
    <!-- Hand suggestion -->
    <ellipse cx="65" cy="315" rx="10" ry="14" fill="url(#skin)"/>
    
    <!-- Simple bracelet -->
    <ellipse cx="65" cy="280" rx="8" ry="3" fill="none" stroke="#c8a050" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Earrings (simple drops) -->
    <line x1="-28" y1="80" x2="-28" y2="92" stroke="#c8a050" stroke-width="1"/>
    <circle cx="-28" cy="94" r="3" fill="#c8a050" opacity="0.7"/>
    <line x1="28" y1="80" x2="28" y2="92" stroke="#c8a050" stroke-width="1"/>
    <circle cx="28" cy="94" r="3" fill="#c8a050" opacity="0.7"/>
  </g>

  <!-- Small cocktail table in front of her -->
  <ellipse cx="2750" cy="1450" rx="120" ry="40" fill="#4a3020"/>
  <!-- Martini glass -->
  <g transform="translate(2720, 1350)">
    <polygon points="-15,0 0,40 15,0" fill="#ffffff" opacity="0.1"/>
    <rect x="-2" y="40" width="4" height="30" fill="#c8c0b0"/>
    <ellipse cx="0" cy="72" rx="14" ry="4" fill="#c8c0b0"/>
    <!-- Olive -->
    <circle cx="3" cy="15" r="4" fill="#6a8030" opacity="0.7"/>
  </g>
  <!-- Small plate with zakuski -->
  <ellipse cx="2800" cy="1430" rx="40" ry="14" fill="#f0e8e0"/>
  <g fill="#c87040" opacity="0.5">
    <circle cx="2790" cy="1425" r="5"/>
    <circle cx="2810" cy="1428" r="4"/>
    <circle cx="2798" cy="1420" r="3"/>
  </g>

  <!-- Warm interior glow -->
  <ellipse cx="2600" cy="1000" rx="600" ry="500" fill="url(#interiorWarm)"/>

  <!-- Cyrillic menu/sign subtle -->
  <text x="200" y="1600" font-family="serif" font-size="24" fill="#c8a050" opacity="0.2">Добро пожаловать</text>

  <!-- Warm vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#0a0500" stroke-width="350" opacity="0.4" rx="800"/>
</svg>
