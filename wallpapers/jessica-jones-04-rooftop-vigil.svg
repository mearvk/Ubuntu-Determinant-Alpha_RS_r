<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Rooftop night sky -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#030010"/>
      <stop offset="30%" style="stop-color:#0a0520"/>
      <stop offset="60%" style="stop-color:#150a30"/>
      <stop offset="100%" style="stop-color:#0d0818"/>
    </linearGradient>
    <!-- City glow on horizon -->
    <linearGradient id="cityGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2a1545;stop-opacity:0.5"/>
      <stop offset="30%" style="stop-color:#1a0a30;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ddccff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#8866bb;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    <!-- Leather texture -->
    <filter id="leatherTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feComposite in="SourceGraphic" in2="noise" operator="in"/>
    </filter>
    <!-- Wind blur -->
    <filter id="windBlur">
      <feGaussianBlur stdDeviation="2 0"/>
    </filter>
    <!-- Soft glow -->
    <filter id="softGlow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="3840" height="2160" fill="url(#nightSky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="300" cy="150" r="1.5" opacity="0.7"/>
    <circle cx="600" cy="80" r="1" opacity="0.5"/>
    <circle cx="900" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="1200" cy="100" r="0.8" opacity="0.4"/>
    <circle cx="1500" cy="180" r="1.3" opacity="0.5"/>
    <circle cx="1800" cy="60" r="1" opacity="0.6"/>
    <circle cx="2100" cy="220" r="1.5" opacity="0.4"/>
    <circle cx="2400" cy="130" r="0.9" opacity="0.7"/>
    <circle cx="2700" cy="170" r="1.1" opacity="0.5"/>
    <circle cx="3000" cy="90" r="1.4" opacity="0.6"/>
    <circle cx="3300" cy="250" r="1" opacity="0.4"/>
    <circle cx="3600" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="450" cy="350" r="0.8" opacity="0.3"/>
    <circle cx="750" cy="400" r="1" opacity="0.4"/>
    <circle cx="1050" cy="320" r="0.7" opacity="0.5"/>
    <circle cx="1350" cy="380" r="1.1" opacity="0.3"/>
    <circle cx="2550" cy="350" r="0.9" opacity="0.4"/>
    <circle cx="2850" cy="300" r="1" opacity="0.5"/>
    <circle cx="3150" cy="400" r="0.8" opacity="0.3"/>
    <circle cx="3450" cy="320" r="1.2" opacity="0.4"/>
  </g>

  <!-- Moon -->
  <circle cx="3200" cy="300" r="80" fill="#eeddff" opacity="0.15"/>
  <ellipse cx="3200" cy="300" rx="250" ry="250" fill="url(#moonGlow)"/>
  <!-- Moon crescent effect -->
  <circle cx="3220" cy="290" r="70" fill="#030010"/>

  <!-- City skyline (distant) -->
  <g fill="#0a0515">
    <rect x="0" y="1200" width="150" height="960" />
    <rect x="130" y="1100" width="100" height="1060" />
    <rect x="210" y="1150" width="200" height="1010" />
    <rect x="390" y="1000" width="120" height="1160" />
    <rect x="490" y="1080" width="180" height="1080" />
    <rect x="650" y="950" width="100" height="1210" />
    <rect x="730" y="1050" width="250" height="1110" />
    <rect x="960" y="900" width="130" height="1260" />
    <rect x="1070" y="1000" width="200" height="1160" />
    <rect x="1250" y="850" width="150" height="1310" />
    <rect x="1380" y="950" width="280" height="1210" />
    <rect x="1640" y="800" width="120" height="1360" />
    <rect x="1740" y="900" width="200" height="1260" />
    <rect x="1920" y="850" width="180" height="1310" />
    <rect x="2080" y="950" width="250" height="1210" />
    <rect x="2310" y="880" width="130" height="1280" />
    <rect x="2420" y="980" width="200" height="1180" />
    <rect x="2600" y="900" width="160" height="1260" />
    <rect x="2740" y="1000" width="220" height="1160" />
    <rect x="2940" y="920" width="140" height="1240" />
    <rect x="3060" y="1050" width="200" height="1110" />
    <rect x="3240" y="950" width="180" height="1210" />
    <rect x="3400" y="1000" width="250" height="1160" />
    <rect x="3630" y="1100" width="210" height="1060" />
  </g>

  <!-- City lights (scattered windows) -->
  <g fill="#ffcc44" opacity="0.4">
    <rect x="160" y="1150" width="8" height="8"/>
    <rect x="260" y="1200" width="8" height="8"/>
    <rect x="420" y="1050" width="8" height="8"/>
    <rect x="530" y="1130" width="8" height="8"/>
    <rect x="690" y="1000" width="8" height="8"/>
    <rect x="800" y="1100" width="8" height="8"/>
    <rect x="1000" y="950" width="8" height="8"/>
    <rect x="1120" y="1050" width="8" height="8"/>
    <rect x="1300" y="900" width="8" height="8"/>
    <rect x="1450" y="1000" width="8" height="8"/>
    <rect x="1680" y="850" width="8" height="8"/>
    <rect x="1800" y="950" width="8" height="8"/>
    <rect x="1960" y="900" width="8" height="8"/>
    <rect x="2150" y="1000" width="8" height="8"/>
    <rect x="2360" y="930" width="8" height="8"/>
    <rect x="2480" y="1030" width="8" height="8"/>
    <rect x="2650" y="950" width="8" height="8"/>
    <rect x="2800" y="1050" width="8" height="8"/>
    <rect x="2990" y="970" width="8" height="8"/>
    <rect x="3120" y="1100" width="8" height="8"/>
    <rect x="3300" y="1000" width="8" height="8"/>
    <rect x="3460" y="1050" width="8" height="8"/>
    <rect x="3670" y="1150" width="8" height="8"/>
  </g>
  <!-- Purple/blue accent lights -->
  <g fill="#8855cc" opacity="0.3">
    <rect x="420" y="1080" width="6" height="6"/>
    <rect x="800" y="1130" width="6" height="6"/>
    <rect x="1300" y="930" width="6" height="6"/>
    <rect x="1960" y="930" width="6" height="6"/>
    <rect x="2650" y="980" width="6" height="6"/>
    <rect x="3300" y="1030" width="6" height="6"/>
  </g>

  <!-- City glow on horizon -->
  <rect x="0" y="800" width="3840" height="1360" fill="url(#cityGlow)"/>

  <!-- Rooftop surface (foreground) -->
  <path d="M0,1700 L3840,1700 L3840,2160 L0,2160 Z" fill="#0a0610"/>
  <!-- Rooftop edge -->
  <rect x="0" y="1690" width="3840" height="20" fill="#151020"/>
  <!-- Rooftop texture -->
  <g stroke="#1a1025" stroke-width="1" opacity="0.3">
    <line x1="0" y1="1800" x2="3840" y2="1800"/>
    <line x1="0" y1="1900" x2="3840" y2="1900"/>
    <line x1="0" y1="2000" x2="3840" y2="2000"/>
  </g>

  <!-- Rooftop elements -->
  <!-- Water tower (far right) -->
  <g transform="translate(3300, 1400)">
    <rect x="0" y="100" width="8" height="200" fill="#0d0815"/>
    <rect x="80" y="100" width="8" height="200" fill="#0d0815"/>
    <rect x="30" y="120" width="8" height="180" fill="#0d0815"/>
    <rect x="55" y="120" width="8" height="180" fill="#0d0815"/>
    <ellipse cx="44" cy="100" rx="55" ry="70" fill="#0f0a18"/>
    <rect x="-11" y="60" width="110" height="50" fill="#0f0a18" rx="10"/>
  </g>

  <!-- Vent/AC unit -->
  <rect x="400" y="1620" width="150" height="80" fill="#0d0815"/>
  <rect x="410" y="1600" width="40" height="25" fill="#0a0610"/>
  <rect x="500" y="1600" width="40" height="25" fill="#0a0610"/>

  <!-- Antenna -->
  <rect x="2800" y="1500" width="4" height="200" fill="#1a1025"/>
  <line x1="2780" y1="1540" x2="2820" y2="1540" stroke="#1a1025" stroke-width="3"/>
  <line x1="2785" y1="1580" x2="2815" y2="1580" stroke="#1a1025" stroke-width="2"/>

  <!-- Jessica Jones - standing at rooftop edge, looking out at city -->
  <!-- She's positioned slightly left of center, back to viewer, wind in hair -->
  <g transform="translate(1600, 1200)">
    <!-- Boots -->
    <rect x="-20" y="440" width="18" height="50" fill="#0a0a0f"/>
    <rect x="5" y="440" width="18" height="50" fill="#0a0a0f"/>
    <!-- Legs (dark jeans) -->
    <path d="M-18,320 L-20,440 L-2,440 L0,320 Z" fill="#10101e"/>
    <path d="M3,320 L5,440 L23,440 L20,320 Z" fill="#10101e"/>
    <!-- Torso (leather jacket from behind) -->
    <path d="M-40,150 L-30,320 L33,320 L43,150 Z" fill="#12101c"/>
    <!-- Jacket center seam -->
    <line x1="1" y1="155" x2="1" y2="320" stroke="#1a1828" stroke-width="1.5"/>
    <!-- Jacket collar -->
    <path d="M-30,150 L-15,140 L0,148 L15,140 L30,150" fill="none" stroke="#1e1a2a" stroke-width="3"/>
    <!-- Arms at sides, slightly away from body -->
    <path d="M-40,170 L-55,280 L-50,350 L-35,340" fill="#12101c"/>
    <path d="M43,170 L58,280 L53,350 L38,340" fill="#12101c"/>
    <!-- Head (back of head) -->
    <ellipse cx="1" cy="120" rx="25" ry="30" fill="#0d0d12"/>
    <!-- Hair blowing in wind (to the right) -->
    <path d="M20,100 Q50,90 70,100 Q80,110 75,120" fill="#0d0d12" filter="url(#windBlur)"/>
    <path d="M15,110 Q45,100 65,110 Q75,120 70,130" fill="#0a0a0f" filter="url(#windBlur)"/>
    <path d="M18,120 Q48,112 60,120" fill="#0a0a0f" filter="url(#windBlur)"/>
    <!-- Hair base -->
    <path d="M-25,110 Q-30,130 -25,150 L-15,145 Q-20,125 -18,110" fill="#0d0d12"/>
    <!-- Scarf blowing in wind -->
    <path d="M-10,145 Q30,135 60,150 Q80,155 100,145" fill="#3a1a55" opacity="0.7" filter="url(#windBlur)"/>
    <path d="M-5,150 Q35,142 65,155 Q85,160 105,150" fill="#2d1045" opacity="0.5" filter="url(#windBlur)"/>
  </g>

  <!-- Wind streaks -->
  <g stroke="#2d1b4e" stroke-width="1" opacity="0.2">
    <line x1="1700" y1="1350" x2="1900" y2="1345"/>
    <line x1="1650" y1="1380" x2="1850" y2="1375"/>
    <line x1="1750" y1="1400" x2="1950" y2="1395"/>
    <line x1="1600" y1="1420" x2="1800" y2="1415"/>
  </g>

  <!-- Atmospheric haze -->
  <rect x="0" y="1100" width="3840" height="600" fill="#1a0a30" opacity="0.06"/>

  <!-- Vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#000000" stroke-width="450" opacity="0.5" rx="900"/>
</svg>
