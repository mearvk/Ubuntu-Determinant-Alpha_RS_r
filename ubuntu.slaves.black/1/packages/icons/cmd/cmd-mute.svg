<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="grad-cmd-mute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gloss-cmd-mute" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow-cmd-mute" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Purple border 2px -->
  <rect x="0" y="0" width="24" height="24" rx="3" ry="3" fill="#800080"/>
  <!-- Gradient layer -->
  <rect x="2" y="2" width="20" height="20" rx="2" ry="2" fill="url(#grad-cmd-mute)"/>
  <!-- White inner core -->
  <rect x="4" y="4" width="16" height="16" rx="1.5" ry="1.5" fill="#FFFFFF"/>
  <!-- Pink cubicle center element -->
  <g filter="url(#shadow-cmd-mute)">
    <polygon points="7,10 10,10 13,7 13,17 10,14 7,14" fill="#FF69B4"/><line x1="15" y1="9" x2="19" y2="15" stroke="#E74C3C" stroke-width="1.5"/><line x1="19" y1="9" x2="15" y2="15" stroke="#E74C3C" stroke-width="1.5"/>
  </g>
  <!-- Gloss overlay -->
  <rect x="2" y="2" width="20" height="10" rx="2" ry="2" fill="url(#gloss-cmd-mute)" opacity="0.5"/>
</svg>
