# ─── Feed Mode ────────────────────────────────────────────────────────
# Options: daily, command, feed-update, reminder
#   daily       = Cron-compatible daily auto-feed at specified hour
#   command     = Feed only when explicitly asked (psych-id feed)
#   feed-update = Feed AND update analysis on command
#   reminder    = Occasional reminder (random interval between min/max hours)
feed_mode = daily

# Daily mode: hour and minute (24h format)
daily_hour = 3
daily_minute = 0

# Reminder mode: range of hours between feeds
reminder_min_hours = 8
reminder_max_hours = 36

# ─── Scanner ──────────────────────────────────────────────────────────
# Timeout per port scan (milliseconds)
scan_timeout_ms = 5000

# Maximum parallel scans
max_concurrent_scans = 4

# Enable TLS certificate probing on ports 443/8443
enable_tls = 1

# ─── Analyzer Engine ──────────────────────────────────────────────────
# Enable search engine prescription generation
enable_search = 1

# Enable web content fetching for prescribed URLs
# (Set to 0 for passive mode — prescriptions generated but not fulfilled)
enable_web_fetch = 0

# Preferred search engines (comma-separated, in priority order)
search_engines = duckduckgo,google,bing

# ─── Database ─────────────────────────────────────────────────────────
# Path to SQLite database (~300 MB max)
db_path = /var/lib/psych-id/suspects.db

# ─── Logging ──────────────────────────────────────────────────────────
# Log file path
log_path = /var/log/psych-id.log

# Verbosity: 0=errors only, 1=normal, 2=debug
verbose = 1

# ─── Targets ──────────────────────────────────────────────────────────
# File containing hosts to scan (one per line, # for comments)
targets_file = /etc/psych-id/targets.txt
