# /etc/national-time.conf — National Time Reference Configuration
# Ubuntu Determinant Alpha — Galactic Cherry Marvell Edition 98
#
# This file configures the national time reference clock.
# The national clock is INDEPENDENT of the system clock (CLOCK_REALTIME).
# Programs that need compliance-grade timestamps query the national clock.
# The system clock remains under administrator control.
#
# Copyright (C) 2026 MEARVK LLC

# ===========================================================================
# National Timezone
# ===========================================================================
# The civil timezone for national time reporting.
# Programs calling national_date_today() get dates in this timezone.
#
# For US federal systems: America/New_York (Eastern Time)
# The Federal Reserve, SEC, and most government agencies use Eastern.
# ACH processing windows are defined in Eastern Time.
timezone = America/New_York

# ===========================================================================
# Sync Interval (seconds)
# ===========================================================================
# How often to query NTP servers for reference time.
# Lower = more accurate, higher = less network traffic.
# 60 seconds is appropriate for most servers.
# Financial systems may use 10-30 seconds.
sync_interval = 60

# ===========================================================================
# Drift Alert Threshold (microseconds)
# ===========================================================================
# If the system clock drifts more than this amount from national time,
# a DRIFT_ALERT is logged. The system clock is NOT corrected — that's
# the administrator's decision.
#
# 1,000,000 µs = 1 second (default)
# Financial: use 100,000 µs (100ms) for tighter monitoring
# Legal: 1,000,000 µs (1 second) is generally acceptable
drift_alert_usec = 1000000

# ===========================================================================
# NTP Servers (priority order)
# ===========================================================================
# Primary: NIST servers (US national standard, stratum 1)
# Fallback: pool.ntp.org (global NTP pool, stratum 2+)
#
# Uncomment to override defaults:
# ntp_server_1 = time.nist.gov
# ntp_server_2 = time-a-wwv.nist.gov
# ntp_server_3 = time-b-wwv.nist.gov
# ntp_server_4 = pool.ntp.org

# ===========================================================================
# GPS Source (if hardware present)
# ===========================================================================
# If a GPS receiver is connected (USB or serial), it provides stratum 0
# time (direct from satellites). This is more authoritative than NTP.
#
# gps_device = /dev/ttyUSB0
# gps_enabled = false

# ===========================================================================
# Maximum Drift Before Refusal
# ===========================================================================
# If national clock hasn't synced for too long and estimated drift exceeds
# this value, national_time_now() returns an error rather than a potentially
# inaccurate time. Programs must then fall back to system clock.
#
# 600,000,000 µs = 10 minutes (default)
# This is conservative — typical crystal drift is ~100ppm, which means
# ~6 seconds per day. So 10 minutes of drift implies ~100 days without sync.
max_drift_usec = 600000000

# ===========================================================================
# Admin Override
# ===========================================================================
# If true, the administrator can manually set the national time reference
# via national_time_set_manual(). Requires sudo_gate Grade 7+.
# This is for airgapped systems with no NTP access.
allow_manual_override = true

# ===========================================================================
# Audit Logging
# ===========================================================================
# Log all national time queries from registered programs.
# Useful for compliance audits ("prove your timestamps are from NIST").
audit_log = /var/log/national-time.log
audit_enabled = true

# ===========================================================================
# Compliance Domains
# ===========================================================================
# Programs register their compliance domain (financial, legal, medical, etc.)
# This section configures per-domain requirements.
#
# [financial]
# max_drift_usec = 100000
# require_nist = true
# require_sync = true
#
# [legal]
# max_drift_usec = 1000000
# require_nist = false
# require_sync = true
#
# [medical]
# max_drift_usec = 1000000
# require_nist = false
# require_sync = true
